    --good-bg: #0f3327;
    --bad: #ff8a80;
    --bad-bg: #40191a;
    --mid: #ffcf66;
    --mid-bg: #3a2c0a;
    --flame: #ff8a3d;
    --heart: #ff6f9c;
    --bolt: #ffdd55;
    --ice: #6aa9f2;
    --series-1: #3987e5;
    --series-2: #d95926;
    --chart-surface: #171f38;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
.en { font-family: var(--en); }
.center { text-align: center; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

.main {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.main-sub { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
.is-loading .main::before { content: "Chargement du contenu…"; color: var(--ink-2); padding: 40px 0; text-align: center; }

/* ---------- Barre d'onglets ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; justify-content: center;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1 1 0; max-width: 140px; min-height: 60px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: 0; color: var(--ink-2); font-size: 12px; font-weight: 600;
}
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .icon { background: var(--mark); color: var(--on-mark); }
.tab .icon { display: grid; place-items: center; width: 48px; height: 28px; border-radius: 14px; }
.icon { display: inline-flex; vertical-align: middle; }
.icon svg { display: block; }

/* ---------- Accueil ---------- */
.home-head { display: flex; flex-direction: column; gap: 12px; }
.brand { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pill {
  display: flex; align-items: center; gap: 5px; min-height: 44px; padding: 6px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; white-space: nowrap; overflow: hidden;
}
.pill strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.pill-label { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.pill-streak .icon { color: var(--ink-2); }
.pill-streak.is-on .icon:first-child { color: var(--flame); }
.pill-streak .freeze { color: var(--ice); }
.pill-hearts .icon { color: var(--heart); }
.pill-xp .icon { color: var(--bolt); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);
}
.card h2 { font-size: 17px; font-weight: 700; }
.goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.goal-xp { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.due-line { font-size: 15px; color: var(--ink-2); }
.due-line strong { color: var(--ink); font-size: 17px; }
.cta-note { font-size: 13.5px; color: var(--ink-2); }

.bar { height: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--mark); border-radius: 7px; transition: width .35s ease; min-width: 0; }
.bar-done .bar-fill { background: var(--good); }
.bar-thin { height: 8px; }
.bar-session { flex: 1; height: 12px; }

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.section-title { font-size: 15px; font-weight: 700; color: var(--ink-2); margin: 4px 2px 8px; }
.page-title { font-size: 24px; font-weight: 800; }
.lead { color: var(--ink-2); font-size: 15.5px; }
.empty { color: var(--ink-2); font-size: 15px; padding: 8px 2px; }

.theme-list { display: flex; flex-direction: column; gap: 8px; }
.theme-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 68px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px;
}
.theme-icon { font-size: 24px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--paper); border-radius: 12px; flex: none; }
.theme-body { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.theme-title { font-weight: 700; font-size: 16px; }
.theme-meta { font-size: 12.5px; color: var(--ink-2); }
.theme-pct { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; flex: none; }
.theme-desc { color: var(--ink-2); font-size: 15px; }

.banner { border-radius: 12px; padding: 10px 14px; font-size: 14.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.banner-info { background: var(--mid-bg); color: var(--ink); }
.banner-warn { background: var(--bad-bg); color: var(--ink); }

/* ---------- Boutons ---------- */
.btn {
  min-height: var(--tap); padding: 12px 18px; border-radius: 14px; border: 1px solid transparent;
  font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; text-align: center;
}
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 3px 0 rgba(0, 0, 0, .28); }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .28); }
.btn-primary:disabled { background: var(--line); color: var(--ink-2); box-shadow: none; transform: none; }
.btn-soft { background: var(--surface); border-color: var(--line); flex-direction: column; gap: 0; }
.btn-quiet { background: none; color: var(--ink-2); }
.btn-danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn-title { font-size: 16px; }
.btn-sub { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.link { background: none; border: 0; padding: 8px 4px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 14.5px; font-weight: 600; min-height: 40px; white-space: nowrap; }
.link-danger { color: var(--bad); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink-2); flex: none; }

/* ---------- Sous-écrans ---------- */
.sub-head { display: flex; align-items: center; gap: 4px; margin-left: -10px; }
.sub-head h1 { font-size: 21px; font-weight: 800; }
.stat-row, .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-grid { grid-template-columns: repeat(2, 1fr); }
.stat-box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.stat-grid .stat-box, .summary .stat-box { background: var(--surface); }
.stat-box strong { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat-box span { font-size: 12.5px; color: var(--ink-2); }
.term-list, .word-list, .missed, .pair-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.term-list li { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.term-list .en { font-weight: 700; }
.term-fr { color: var(--ink-2); font-size: 15px; flex: 1; }

/* ---------- Session ---------- */
.main-session { min-height: 100vh; min-height: 100dvh; padding-bottom: 0; gap: 12px; }
.session-head { display: flex; align-items: center; gap: 8px; margin-left: -10px; }
.session-hearts { display: flex; align-items: center; gap: 4px; color: var(--heart); font-weight: 800; font-size: 18px; }
.session-hearts strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.session-hearts.is-muted { opacity: .45; }
.session-body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; }
.session-foot {
  position: sticky; bottom: 0; margin: 0 -16px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--paper) 78%, transparent);
}
.session-foot.has-feedback { position: static; padding: 0; background: none; }
.ex-meta { display: flex; }
.tag { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.tag-new { background: var(--mark); color: var(--on-mark); border-color: transparent; }
.tag-retry { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.instruction { font-size: 20px; font-weight: 800; line-height: 1.25; }
.ex { display: flex; flex-direction: column; gap: 14px; }
.sentence { font-size: 21px; line-height: 1.5; white-space: pre-line; }
.sentence.fr { font-size: 19px; font-weight: 600; }
.sentence.question { font-size: 18px; }
.blank {
  display: inline-block; min-width: 3.4em; padding: 0 .35em; margin: 0; text-align: center;
  background: var(--mark); color: var(--on-mark); border-radius: 4px; font-weight: 600;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.hint { font-size: 14.5px; color: var(--ink-2); }
.hint span { font-style: italic; }
.hint-reveal { background: var(--mid-bg); color: var(--ink); padding: 8px 12px; border-radius: 10px; font-size: 16px; }
.hint-reveal span { font-style: normal; font-weight: 700; }
.hint-btn { align-self: flex-start; white-space: normal; text-align: left; }

.answer-input, .input {
  width: 100%; min-height: var(--tap); padding: 12px 14px; font-size: 19px; color: var(--ink);
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; font-family: var(--ui); resize: none;
}
.answer-input.en { font-family: var(--en); }
.answer-input:focus, .input:focus { outline: none; border-color: var(--ink); }
.answer-input.is-right { border-color: var(--good); background: var(--good-bg); }
.answer-input.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.answer-input.is-almost { border-color: var(--mid); background: var(--mid-bg); }

.choices { display: flex; flex-direction: column; gap: 10px; }
.choices-bank { flex-direction: row; flex-wrap: wrap; }
.choice, .chip, .pair, .word {
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; color: var(--ink);
  box-shadow: 0 2px 0 var(--line);
}
.choice { min-height: var(--tap); padding: 12px 14px; text-align: left; font-size: 18px; line-height: 1.35; }
.choice.fr { font-size: 16.5px; }
.choices-bank .choice { flex: 1 1 40%; text-align: center; }
.choice[aria-pressed="true"], .pair[aria-pressed="true"], .word[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 2px 0 var(--ink); background: var(--mark); color: var(--on-mark); }
.is-right, .choice.is-right { border-color: var(--good) !important; background: var(--good-bg) !important; color: var(--ink) !important; box-shadow: none !important; }
.is-wrong, .choice.is-wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; color: var(--ink) !important; box-shadow: none !important; }
.is-target { border-color: var(--good) !important; background: var(--good-bg) !important; text-decoration: line-through; text-decoration-color: var(--bad); }

.order-answer {
  min-height: 116px; padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; align-items: center; gap: 8px;
  border: 2px dashed var(--line); border-radius: 14px; background: var(--surface);
}
.order-pool, .words { display: flex; flex-wrap: wrap; gap: 8px; }
.chip, .word { min-height: 46px; padding: 8px 14px; font-size: 19px; }
.order-end { font-family: var(--en); font-size: 22px; font-weight: 700; }
.words { gap: 6px 6px; }
.word { padding: 6px 10px; }

.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pairs-col { display: flex; flex-direction: column; gap: 10px; }
.pair { min-height: 60px; padding: 8px 10px; font-size: 16px; line-height: 1.25; }
.pair.en { font-size: 17.5px; }
.pair:disabled { opacity: .75; }

.audio { display: flex; align-items: center; gap: 16px; }
.play { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0, 0, 0, .28); flex: none; }
.play:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .28); }
.audio-side { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.audio-label { font-size: 14px; color: var(--ink-2); }
.chip-toggle { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-size: 14.5px; font-weight: 700; }
.chip-toggle[aria-pressed="true"] { background: var(--mark); color: var(--on-mark); border-color: var(--ink); }
.speak { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-grid; place-items: center; flex: none; vertical-align: middle; }
.speak-inline { margin-left: 6px; }

.chart-card { margin: 0; background: var(--chart-surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 8px 4px; }
.ep-chart { width: 100%; height: auto; display: block; font-family: var(--ui); }
.ep-chart-title { font-size: 13px; font-weight: 700; fill: var(--ink); }
.ep-chart-legend, .ep-chart-label { font-size: 11px; fill: var(--ink-2); }
.ep-chart-value { font-size: 11px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.ep-chart-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.ep-chart-axis { stroke: var(--ink-2); stroke-width: 1; }

/* ---------- Retour après réponse ---------- */
.feedback {
  margin: 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  border-top: 3px solid var(--line); display: flex; flex-direction: column; gap: 8px;
  animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.fb-correct { background: var(--good-bg); border-color: var(--good); }
.fb-almost { background: var(--mid-bg); border-color: var(--mid); }
.fb-wrong { background: var(--bad-bg); border-color: var(--bad); }
.fb-title { font-size: 20px; font-weight: 800; }
.fb-correct .fb-title { color: var(--good); }
.fb-almost .fb-title { color: var(--mid); }
.fb-wrong .fb-title { color: var(--bad); }
.fb-label { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.fb-answer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.answer-line { font-size: 19px; line-height: 1.4; font-weight: 600; }
.fb-answer-quiet .answer-line { font-weight: 400; font-size: 17px; }
.answer-sub { font-size: 15.5px; color: var(--ink-2); }
.answer-line mark, mark { background: var(--mark); color: var(--on-mark); padding: 0 .25em; border-radius: 3px; }
.fb-explain { font-size: 15.5px; }
.fb-note { font-size: 14px; color: var(--ink-2); }
.fb-heart { font-size: 14.5px; font-weight: 700; color: var(--heart); display: flex; align-items: center; gap: 4px; }
.btn-continue { margin-top: 6px; background: var(--ink); color: var(--paper); }
.fb-correct .btn-continue { background: var(--good); color: #fff; }
.fb-wrong .btn-continue { background: var(--bad); color: #fff; }
@media (prefers-color-scheme: dark) {
  .fb-correct .btn-continue, .fb-wrong .btn-continue { color: #0d1322; }
}
.pair-list li { font-size: 16px; }
.pair-list .en { font-weight: 700; }

/* ---------- Fin de session ---------- */
.summary { display: flex; flex-direction: column; gap: 16px; padding-top: 24px; text-align: center; }
.summary h1 { font-size: 26px; font-weight: 800; }
.summary .card { text-align: left; }
.sum-badge { width: 96px; height: 96px; border-radius: 50%; background: var(--mark); color: var(--on-mark); display: grid; place-items: center; margin: 0 auto; }
.sum-note { font-size: 15px; display: flex; gap: 6px; align-items: flex-start; }
.sum-note .icon { flex: none; margin-top: 1px; }
.sum-good .icon { color: var(--flame); }

/* ---------- Flashcards ---------- */
.flash-card {
  flex: 1; min-height: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  padding: 24px 20px; display: flex; flex-direction: column; justify-content: center; gap: 14px; text-align: center;
}
.flash-side { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.flash-main { font-size: 28px; line-height: 1.25; font-weight: 700; }
.flash-main.fr { font-size: 25px; }
.flash-fr { font-size: 19px; color: var(--ink-2); }
.flash-example { font-size: 18px; line-height: 1.45; border-top: 1px solid var(--line); padding-top: 14px; }
.flash-count { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trio .btn { padding: 12px 6px; font-size: 16px; }
.btn-bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn-mid { background: var(--mid-bg); color: var(--mid); border-color: var(--mid); }
.btn-good { background: var(--good-bg); color: var(--good); border-color: var(--good); }

/* ---------- Formulaires, réglages ---------- */
.form { gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; font-weight: 700; color: var(--ink-2); }
.field-row { flex-direction: row; align-items: center; justify-content: space-between; }
.input { font-size: 17px; font-weight: 400; }
.input-time { width: auto; min-width: 130px; }
select.input { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 22px) 55%, calc(100% - 16px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; min-height: 160px; }
.form-error { color: var(--bad); font-size: 14.5px; font-weight: 600; }
.setting { display: flex; flex-direction: column; gap: 6px; }
.setting-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.setting-label { font-size: 14.5px; font-weight: 700; color: var(--ink-2); }
.seg { display: flex; gap: 0; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--paper); }
.seg-btn { flex: 1; min-height: 48px; border: 0; background: none; font-weight: 700; font-size: 15.5px; color: var(--ink-2); padding: 6px 4px; }
.seg-btn + .seg-btn { border-left: 2px solid var(--line); }
.seg-btn[aria-pressed="true"] { background: var(--mark); color: var(--on-mark); }
.switch { width: 58px; height: 34px; border-radius: 17px; border: 2px solid var(--line); background: var(--paper); padding: 0; position: relative; flex: none; }
.switch-knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-2); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--good); border-color: var(--good); }
.switch[aria-checked="true"] .switch-knob { transform: translateX(24px); background: #fff; }
.switch:disabled { opacity: .45; }

.word-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.word-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.word-en { font-weight: 700; font-size: 18px; }
.word-ex { font-size: 15px; color: var(--ink-2); font-style: italic; }
.word-status { font-size: 12.5px; color: var(--ink-2); }

.table { width: 100%; border-collapse: collapse; font-size: 15px; }
.table th, .table td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.table thead th { font-size: 12.5px; color: var(--ink-2); }
.table tbody th { font-weight: 600; }
.table td { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.table thead th:not(:first-child) { text-align: right; }
.missed { counter-reset: m; gap: 0; }
.missed li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.missed li:last-child { border-bottom: 0; }
.missed-n { margin-left: auto; font-size: 13px; color: var(--bad); font-weight: 700; white-space: nowrap; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.week-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.week-val { font-size: 11px; color: var(--ink-2); min-height: 14px; font-variant-numeric: tabular-nums; }
.week-track { width: 100%; height: 84px; display: flex; align-items: flex-end; background: var(--paper); border-radius: 6px; overflow: hidden; }
.week-bar { width: 100%; background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 0; }
.week-day { font-size: 12px; color: var(--ink-2); }
.week-col.is-today .week-day { color: var(--ink); font-weight: 800; }

/* ---------- Modale, message ---------- */
.modal-layer { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 24, .55); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.modal { width: 100%; max-width: 520px; background: var(--surface); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; margin-bottom: env(safe-area-inset-bottom); max-height: 86vh; overflow: auto; }
.modal-title { font-size: 19px; font-weight: 800; }
.modal-body { display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.modal-actions .btn { flex: 1 1 auto; }
.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); z-index: 30;
  max-width: min(92vw, 480px); background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 14px;
  font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.in-sub .toast { bottom: calc(110px + env(safe-area-inset-bottom)); }

@media (min-width: 700px) {
  .modal-layer { align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- Synchronisation ---------- */
.howto { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--paper); font-size: 14.5px; }
.howto summary { font-weight: 700; cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.howto ol { margin: 8px 0 2px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.code-input { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }

</style>

  <noscript><p style="padding:24px">English Pro a besoin de JavaScript pour fonctionner.</p></noscript>

  <script>window.EP_CONTENT = [{"id":"meetings","title":"Réunions","icon":"🗣️","description":"Ouvrir et animer une réunion, donner son avis, exprimer un désaccord poliment, interrompre, demander une clarification, conclure et répartir les actions.","items":[{"id":"mtg-001","theme":"meetings","type":"fill","prompt":"Shall we get ___? We have a lot to cover today.","hint":"commencer (un mot)","answers":["started"],"explanation":"« Shall we get started? » est la formule la plus courante pour lancer une réunion. « Shall we…? » sert à proposer.","term":"to get started","fr":"commencer, s'y mettre"},{"id":"mtg-002","theme":"meetings","type":"fill","prompt":"The main ___ of today's meeting is to review the Q3 forecast.","hint":"objectif, but","answers":["purpose","aim","objective","goal"],"explanation":"« The purpose of today's meeting is to… » annonce l'objet de la réunion. « Aim », « objective » et « goal » conviennent aussi.","term":"the purpose of the meeting","fr":"l'objet de la réunion"},{"id":"mtg-003","theme":"meetings","type":"fill","prompt":"Let's move ___ to the next item on the agenda.","hint":"particule : passer à","answers":["on"],"explanation":"« To move on to » = passer à (un autre sujet). « Agenda » désigne l'ordre du jour, pas un agenda papier (diary / planner).","term":"to move on to","fr":"passer à (le point suivant)"},{"id":"mtg-004","theme":"meetings","type":"fill","prompt":"Sorry to ___, but could I add something here?","hint":"interrompre","answers":["interrupt","cut in"],"explanation":"On s'excuse avant d'interrompre : « Sorry to interrupt, but… ». « To cut in » est un peu plus familier.","term":"Sorry to interrupt","fr":"Désolé de vous interrompre"},{"id":"mtg-005","theme":"meetings","type":"fill","prompt":"Could you ___ what you mean by one-off costs?","hint":"clarifier, préciser","answers":["clarify","explain","specify"],"explanation":"« Could you clarify what you mean by…? » est la façon polie de demander une précision. « One-off costs » = coûts non récurrents.","term":"to clarify","fr":"clarifier, préciser"},{"id":"mtg-006","theme":"meetings","type":"fill","prompt":"I'm afraid I don't quite ___ with you on that point.","hint":"être d'accord","answers":["agree"],"explanation":"« To agree » est un verbe : on dit « I agree », jamais « I am agree ». « I'm afraid » et « quite » adoucissent le désaccord.","term":"to agree with","fr":"être d'accord avec"},{"id":"mtg-007","theme":"meetings","type":"fill","prompt":"To ___ up, we agreed to close the books by Friday.","hint":"résumer (commence par s)","answers":["sum"],"explanation":"« To sum up » = pour résumer. Formule de conclusion avant de rappeler les décisions.","term":"to sum up","fr":"résumer, pour résumer"},{"id":"mtg-008","theme":"meetings","type":"fill","prompt":"Who is going to take the ___ today?","hint":"compte rendu de réunion","answers":["minutes"],"explanation":"« The minutes » (toujours au pluriel) = le compte rendu. « To take the minutes » = le rédiger.","term":"to take the minutes","fr":"rédiger le compte rendu"},{"id":"mtg-009","theme":"meetings","type":"fill","prompt":"Let's ___ this offline; it only concerns the two of us.","hint":"prendre","answers":["take","discuss"],"explanation":"« Let's take this offline » = parlons-en en dehors de la réunion, pour ne pas faire perdre de temps aux autres.","term":"to take something offline","fr":"en reparler en dehors de la réunion"},{"id":"mtg-010","theme":"meetings","type":"fill","prompt":"I'll ___ up with the client and get back to you by Thursday.","hint":"suivre : assurer le suivi","answers":["follow"],"explanation":"« To follow up with someone » = relancer quelqu'un, assurer le suivi. « To get back to someone » = revenir vers quelqu'un.","term":"to follow up with","fr":"relancer, assurer le suivi auprès de"},{"id":"mtg-011","theme":"meetings","type":"fill","bank":true,"prompt":"Thanks everyone for ___ today.","answers":["joining"],"distractors":["joined","to join","join"],"explanation":"Après « for », le verbe est en -ing : « Thanks for joining ». Pour « assister à une réunion », on dit « to attend » ou « to join » ; « to assist » signifie aider."},{"id":"mtg-012","theme":"meetings","type":"fill","bank":true,"prompt":"Let's ___ a follow-up meeting for next Tuesday.","answers":["schedule"],"distractors":["program","agenda","date"],"explanation":"« To schedule a meeting » = planifier une réunion. « Agenda » est un nom (l'ordre du jour), jamais un verbe.","note":"Prononciation : « schedule » se dit plutôt « chédioul » au Royaume-Uni et « skédjoul » aux États-Unis."},{"id":"mtg-013","theme":"meetings","type":"fill","bank":true,"prompt":"We're running ___ of time, so let's wrap up.","answers":["out"],"distractors":["off","away","over"],"explanation":"« To run out of time » = manquer de temps. « To wrap up » = conclure."},{"id":"mtg-014","theme":"meetings","type":"conjugate","prompt":"Last week we ___ (to agree) to postpone the system migration.","answers":["agreed"],"explanation":"« Last week » situe l'action à un moment terminé : past simple (prétérit)."},{"id":"mtg-015","theme":"meetings","type":"conjugate","prompt":"We ___ (to discuss) this issue three times since January.","answers":["have discussed"],"explanation":"« Since January » relie le passé au présent : present perfect. Et on dit « discuss an issue », sans « about »."},{"id":"mtg-016","theme":"meetings","type":"conjugate","prompt":"If everyone agrees, I ___ (to send) the minutes this afternoon.","answers":["will send","'ll send"],"explanation":"Condition réelle : « if » + présent, puis « will » + base verbale. Jamais « will » après « if » dans ce cas."},{"id":"mtg-017","theme":"meetings","type":"conjugate","prompt":"While Anna ___ (to present) the figures, the connection dropped.","answers":["was presenting"],"explanation":"Action en cours (past continuous) interrompue par une action brève (past simple)."},{"id":"mtg-018","theme":"meetings","type":"conjugate","prompt":"Could you let me know once the client ___ (to confirm) the date?","answers":["has confirmed","confirms"],"explanation":"Après « once » ou « when », pas de futur en anglais : on emploie le présent ou le present perfect."},{"id":"mtg-019","theme":"meetings","type":"translate","direction":"fr-en","prompt":"Passons au point suivant.","answers":["Let's move on to the next point.","Let's move on to the next item.","Let us move on to the next point.","Let's move to the next point.","Let's move to the next item.","Let's go on to the next point."],"explanation":"« Let's move on to the next item / point » : formule standard pour avancer dans l'ordre du jour.","term":"Let's move on to the next item.","fr":"Passons au point suivant."},{"id":"mtg-020","theme":"meetings","type":"translate","direction":"fr-en","prompt":"Je suis d'accord avec vous.","answers":["I agree with you."],"reject":["I am agree with you."],"explanation":"« I agree with you. » Le verbe « agree » se conjugue directement : « I am agree » est l'une des erreurs les plus fréquentes chez les francophones."},{"id":"mtg-021","theme":"meetings","type":"translate","direction":"fr-en","prompt":"l'ordre du jour","answers":["the agenda","agenda"],"explanation":"« The agenda » = l'ordre du jour d'une réunion. L'agenda où l'on note ses rendez-vous se dit « diary » (GB) ou « planner / calendar » (US).","term":"the agenda","fr":"l'ordre du jour"},{"id":"mtg-022","theme":"meetings","type":"translate","direction":"fr-en","prompt":"reporter une réunion","answers":["to postpone a meeting","to put off a meeting","to push back a meeting","to reschedule a meeting","to put a meeting off","to push a meeting back"],"explanation":"« To postpone » = reporter à plus tard. « To report » signifie rendre compte : c'est un faux ami.","term":"to postpone a meeting","fr":"reporter une réunion"},{"id":"mtg-023","theme":"meetings","type":"translate","direction":"fr-en","prompt":"une échéance","answers":["a deadline"],"explanation":"« A deadline » = une date limite. « To meet a deadline » = tenir un délai ; « to miss a deadline » = le dépasser.","term":"a deadline","fr":"une échéance, une date limite"},{"id":"mtg-024","theme":"meetings","type":"translate","direction":"fr-en","prompt":"Qu'en pensez-vous ?","answers":["What do you think?","What do you think about it?","What do you think of it?","What are your thoughts?","What do you think about this?","What do you think about that?"],"explanation":"« What do you think? » invite les participants à donner leur avis. Variante plus formelle : « What are your thoughts on this? »"},{"id":"mtg-025","theme":"meetings","type":"translate","direction":"fr-en","prompt":"un point d'action (à réaliser après la réunion)","answers":["an action item","an action point"],"explanation":"« Action items » = les actions décidées en réunion, chacune avec un responsable (owner) et une échéance (deadline).","term":"an action item","fr":"une action à mener"},{"id":"mtg-026","theme":"meetings","type":"translate","direction":"fr-en","prompt":"Je reviens vers vous demain.","answers":["I'll get back to you tomorrow.","I will come back to you tomorrow."],"explanation":"« To get back to someone » = revenir vers quelqu'un avec une réponse. « I'll come back to you » se dit aussi.","term":"to get back to someone","fr":"revenir vers quelqu'un"},{"id":"mtg-027","theme":"meetings","type":"translate","direction":"en-fr","prompt":"to chair a meeting","answers":["présider une réunion","animer une réunion","diriger une réunion","conduire une réunion","mener une réunion"],"explanation":"« To chair a meeting » = présider, animer une réunion. La personne qui anime est « the chair ».","term":"to chair a meeting","fr":"présider, animer une réunion"},{"id":"mtg-028","theme":"meetings","type":"translate","direction":"en-fr","prompt":"any other business (AOB)","answers":["questions diverses","points divers","divers","sujets divers"],"explanation":"« AOB » (any other business) est le dernier point d'un ordre du jour : les questions diverses.","term":"any other business (AOB)","fr":"questions diverses"},{"id":"mtg-029","theme":"meetings","type":"translate","direction":"en-fr","prompt":"to wrap up","answers":["conclure","terminer","clore","finir","clôturer"],"explanation":"« To wrap up » = conclure. « Let's wrap up » signale que la réunion touche à sa fin.","term":"to wrap up","fr":"conclure"},{"id":"mtg-030","theme":"meetings","type":"mcq","prompt":"Vous n'êtes pas d'accord avec la proposition de votre manager. Quelle formulation est la plus adaptée ?","answers":["I see your point, but I'm not sure that would work."],"distractors":["You are wrong.","I am not agree with you.","That's a bad idea."],"explanation":"On reconnaît d'abord le point de vue de l'autre (« I see your point »), puis on nuance. « You are wrong » est beaucoup trop direct, et « I am not agree » est incorrect."},{"id":"mtg-031","theme":"meetings","type":"mcq","prompt":"Vous voulez intervenir pendant qu'un collègue parle. Que dites-vous ?","answers":["Sorry to interrupt, may I come in here?"],"distractors":["Stop, I want to speak.","Excuse me, you must listen to me.","Wait, it's my turn now."],"explanation":"« May I come in here? » = puis-je intervenir ? On commence par s'excuser de l'interruption."},{"id":"mtg-032","theme":"meetings","type":"mcq","prompt":"Vous n'avez pas bien saisi un chiffre annoncé. Que dites-vous ?","answers":["Sorry, could you run through that figure again?"],"distractors":["What?","Repeat.","I didn't listen, say again."],"explanation":"« Could you run through that again? » = pourriez-vous reprendre ce point ? Un impératif sec (« Repeat. ») passe pour impoli."},{"id":"mtg-033","theme":"meetings","type":"mcq","choices":"fr","prompt":"Que signifie « Let's circle back to this later » ?","answers":["Revenons sur ce point plus tard."],"distractors":["Tournons en rond sur ce point.","Entourons ce point dans le document.","Annulons ce point."],"explanation":"« To circle back to something » = revenir sur un sujet plus tard. Expression très fréquente en réunion.","term":"to circle back to","fr":"revenir sur (un sujet) plus tard"},{"id":"mtg-034","theme":"meetings","type":"mcq","prompt":"Could you ___ me in on what was decided yesterday?","answers":["fill"],"distractors":["put","tell","make"],"explanation":"« To fill someone in on something » = mettre quelqu'un au courant de quelque chose.","term":"to fill someone in","fr":"mettre quelqu'un au courant"},{"id":"mtg-035","theme":"meetings","type":"mcq","prompt":"Quelle phrase attribue correctement une action à un collègue ?","answers":["Marc, could you take the lead on this and report back by Friday?"],"distractors":["Marc, you make this for Friday.","Marc, I assist you to do this until Friday.","Marc, you will do the necessary for Friday."],"explanation":"« To take the lead on » = piloter un sujet ; « to report back » = rendre compte. « By Friday » = d'ici vendredi (« until » marque une durée, pas une échéance)."},{"id":"mtg-036","theme":"meetings","type":"mcq","prompt":"Pour ouvrir une réunion de façon naturelle, on dit :","answers":["Thanks for making the time. Let's get started."],"distractors":["Thanks to be here. We begin.","Thank you for your assistance. Let's start it.","I thank you of your presence. Let's go start."],"explanation":"« Thanks for » + verbe en -ing. « Assistance » veut dire « aide », pas « présence »."},{"id":"mtg-037","theme":"meetings","type":"order","prompt":"Pourriez-vous m'envoyer le compte rendu d'ici vendredi ?","answers":["Could you send me the minutes by Friday?","By Friday could you send me the minutes?"],"explanation":"« Could you » + base verbale. « By Friday » = vendredi au plus tard."},{"id":"mtg-038","theme":"meetings","type":"order","prompt":"Je pense que nous devrions reporter la décision.","answers":["I think we should postpone the decision."],"explanation":"« I think we should… » est une façon mesurée de donner son avis. « Should » est suivi de la base verbale."},{"id":"mtg-039","theme":"meetings","type":"order","prompt":"Parcourons d'abord l'ordre du jour.","answers":["Let's go through the agenda first.","First let's go through the agenda."],"explanation":"« To go through » = passer en revue, parcourir."},{"id":"mtg-040","theme":"meetings","type":"order","prompt":"Quelqu'un a-t-il quelque chose à ajouter ?","answers":["Does anyone have anything to add?"],"explanation":"Dans une question, on emploie « anyone » et « anything ». Formule classique avant de clore un point."},{"id":"mtg-041","theme":"meetings","type":"order","prompt":"Je partagerai les actions à mener après l'appel.","answers":["I will share the action items after the call.","After the call I will share the action items."],"explanation":"« Action items » = la liste des actions décidées, à diffuser après la réunion."},{"id":"mtg-042","theme":"meetings","type":"order","prompt":"Pouvons-nous revenir sur ce point plus tard ?","answers":["Can we come back to this point later?","Can we come back later to this point?","Later can we come back to this point?"],"explanation":"« To come back to a point » = revenir sur un point. Utile pour ne pas bloquer la réunion."},{"id":"mtg-043","theme":"meetings","type":"match","pairs":[["agenda","ordre du jour"],["minutes","compte rendu"],["action item","action à mener"],["deadline","échéance"]],"explanation":"Quatre mots indispensables : « agenda » (ordre du jour), « minutes » (compte rendu), « action item » (action à mener), « deadline » (échéance)."},{"id":"mtg-044","theme":"meetings","type":"match","pairs":[["to chair","présider"],["to postpone","reporter"],["to attend","assister à"],["to wrap up","conclure"]],"explanation":"« To attend a meeting » = assister à une réunion (sans préposition). « To assist » = aider."},{"id":"mtg-045","theme":"meetings","type":"error","prompt":"We discussed [about] the budget during the meeting.","answers":["We discussed the budget during the meeting."],"explanation":"« To discuss » est transitif : on dit « discuss something », sans « about ». En revanche : « to talk about something »."},{"id":"mtg-046","theme":"meetings","type":"error","prompt":"Ten people [assisted] the kick-off meeting yesterday.","answers":["Ten people attended the kick-off meeting yesterday."],"explanation":"Faux ami : « to assist » = aider. Assister à une réunion = « to attend a meeting »."},{"id":"mtg-047","theme":"meetings","type":"error","prompt":"Let's meet [in] Monday at ten to review the figures.","answers":["Let's meet on Monday at ten to review the figures."],"explanation":"Devant un jour ou une date : « on » (on Monday, on 3 March). « In » s'emploie pour les mois et les années ; « at » pour les heures."},{"id":"mtg-048","theme":"meetings","type":"error","prompt":"The steering committee was [reported] to next week.","answers":["The steering committee was postponed to next week."],"explanation":"Faux ami : « to report » = rendre compte, signaler. Reporter = « to postpone ». « Steering committee » = comité de pilotage."},{"id":"mtg-049","theme":"meetings","type":"dictation","answers":["Let's schedule a follow-up call next week."],"explanation":"« A follow-up call » = un appel de suivi. Avec un trait d'union quand c'est un nom ou un adjectif ; sans trait d'union pour le verbe « to follow up »."},{"id":"mtg-050","theme":"meetings","type":"dictation","answers":["Could you share your screen, please?"],"explanation":"« To share your screen » = partager son écran. « Could you…, please? » est la forme polie standard."},{"id":"mtg-051","theme":"meetings","type":"dictation","answers":["I'll send the minutes after the meeting.","I will send the minutes after the meeting."],"explanation":"« I'll » = « I will » : décision prise au moment où l'on parle."},{"id":"mtg-052","theme":"meetings","type":"listen","audio":"Shall we move on to the next item?","prompt":"Que propose la personne ?","answers":["De passer au point suivant"],"distractors":["De reporter la réunion","De revenir au point précédent","De faire une pause"],"explanation":"« Shall we…? » introduit une proposition ; « to move on to the next item » = passer au point suivant."},{"id":"mtg-053","theme":"meetings","type":"listen","audio":"I'm afraid I have to disagree with you there.","prompt":"Que veut dire la personne ?","answers":["Elle n'est pas d'accord et le dit poliment."],"distractors":["Elle a peur de la réaction de son collègue.","Elle est d'accord avec la proposition.","Elle n'a pas compris la question."],"explanation":"« I'm afraid » ne signifie pas ici « j'ai peur » : c'est une formule d'atténuation, comme « je crains que » ou « malheureusement »."},{"id":"mtg-054","theme":"meetings","type":"fill","prompt":"Just to make sure we're on the same ___: the deadline is 15 March, correct?","hint":"expression : être sur la même longueur d'onde","answers":["page"],"explanation":"« To be on the same page » = être sur la même longueur d'onde, avoir la même compréhension.","term":"to be on the same page","fr":"être sur la même longueur d'onde"}]},{"id":"emails","title":"E-mails professionnels","icon":"✉️","description":"Formules d'ouverture et de clôture selon le registre, relancer, s'excuser d'un retard, demander un document, transmettre une pièce jointe, fixer une échéance.","items":[{"id":"eml-001","theme":"emails","type":"fill","prompt":"Please find ___ the trial balance as at 31 December.","hint":"ci-joint","answers":["attached","enclosed"],"explanation":"« Please find attached… » = veuillez trouver ci-joint. « Enclosed » s'emploie plutôt pour un courrier papier. « Trial balance » = balance générale.","term":"Please find attached","fr":"Veuillez trouver ci-joint"},{"id":"eml-002","theme":"emails","type":"fill","prompt":"I look forward to ___ from you.","hint":"avoir de vos nouvelles (verbe en -ing)","answers":["hearing"],"explanation":"Dans « look forward to », « to » est une préposition : elle est suivie d'un verbe en -ing (hearing), pas d'un infinitif.","term":"I look forward to hearing from you.","fr":"Dans l'attente de votre réponse."},{"id":"eml-003","theme":"emails","type":"fill","prompt":"I am writing to ___ about the outstanding invoices.","hint":"se renseigner","answers":["enquire","inquire","ask"],"explanation":"« I am writing to enquire about… » : ouverture formelle pour une demande d'information. « Outstanding invoices » = factures impayées.","note":"GB : enquire · US : inquire","term":"to enquire about","fr":"se renseigner sur"},{"id":"eml-004","theme":"emails","type":"fill","prompt":"Apologies for the ___ in getting back to you.","hint":"retard","answers":["delay"],"explanation":"« Apologies for the delay in getting back to you » = désolé d'avoir tardé à vous répondre. Jamais « retard » : en anglais, ce mot est une insulte.","term":"Apologies for the delay","fr":"Veuillez excuser ce retard"},{"id":"eml-005","theme":"emails","type":"fill","prompt":"Could you please send me the bank statements ___ Friday at the latest?","hint":"d'ici (préposition)","answers":["by"],"explanation":"« By Friday » = vendredi au plus tard (échéance). « Until Friday » = jusqu'à vendredi (durée)."},{"id":"eml-006","theme":"emails","type":"fill","prompt":"Just a gentle ___ that the confirmation letters are due tomorrow.","hint":"rappel","answers":["reminder"],"explanation":"« A gentle / friendly reminder » : façon courtoise de relancer sans mettre la pression.","term":"a gentle reminder","fr":"un petit rappel"},{"id":"eml-007","theme":"emails","type":"fill","prompt":"Please do not ___ to contact me if you have any questions.","hint":"hésiter","answers":["hesitate"],"explanation":"« Please do not hesitate to contact me » : formule de clôture formelle. Version plus simple : « Let me know if you have any questions. »"},{"id":"eml-008","theme":"emails","type":"fill","prompt":"Thank you in ___ for your help.","hint":"par avance","answers":["advance"],"explanation":"« Thank you in advance » = merci par avance. Fréquent dans une demande, juste avant la formule de politesse."},{"id":"eml-009","theme":"emails","type":"fill","prompt":"Further ___ our call this morning, please find the updated schedule below.","hint":"préposition : suite à","answers":["to"],"explanation":"« Further to our call » = suite à notre appel. Registre formel ; plus neutre : « Following our call ».","term":"Further to our call","fr":"Suite à notre appel"},{"id":"eml-010","theme":"emails","type":"fill","prompt":"I would be ___ if you could confirm receipt of this email.","hint":"reconnaissant","answers":["grateful"],"explanation":"« I would be grateful if you could… » = je vous serais reconnaissant de bien vouloir… Demande très polie.","term":"I would be grateful if you could","fr":"Je vous serais reconnaissant de bien vouloir"},{"id":"eml-011","theme":"emails","type":"fill","prompt":"I'm ___ of the office until Monday, with limited access to email.","hint":"absent du bureau : ___ of the office","answers":["out"],"explanation":"« Out of the office » = absent du bureau. Un « out-of-office reply » est un message d'absence automatique.","term":"out of the office","fr":"absent du bureau"},{"id":"eml-012","theme":"emails","type":"fill","prompt":"Could you ___ this email to the finance team, please?","hint":"transférer","answers":["forward"],"explanation":"« To forward an email » = transférer un mail. « To transfer » s'emploie pour un virement ou un appel.","term":"to forward an email","fr":"transférer un mail"},{"id":"eml-013","theme":"emails","type":"fill","bank":true,"prompt":"Dear Mr Thompson, […] Yours ___,","answers":["sincerely"],"distractors":["faithfully","friendly","cordially yours"],"explanation":"Usage britannique : « Yours sincerely » quand on a nommé le destinataire (Dear Mr Thompson), « Yours faithfully » après « Dear Sir or Madam ».","note":"US : « Sincerely, » ou « Best regards, ». Au quotidien, « Kind regards » convient partout."},{"id":"eml-014","theme":"emails","type":"fill","bank":true,"prompt":"I'm copying ___ my manager, who is leading the engagement.","answers":["in"],"distractors":["on","at","with"],"explanation":"« To copy someone in » = mettre quelqu'un en copie. On dit aussi « I've cc'd my manager ».","note":"GB : to copy someone in · US : to cc someone / to copy someone on an email"},{"id":"eml-015","theme":"emails","type":"fill","bank":true,"prompt":"Please let me know if you need any ___ information.","answers":["further"],"distractors":["farther","more of","another"],"explanation":"« Further information » = des informations complémentaires. « Farther » ne s'emploie que pour une distance physique."},{"id":"eml-016","theme":"emails","type":"conjugate","prompt":"As ___ (to discuss) yesterday, I am sending you the draft report.","answers":["discussed"],"explanation":"« As discussed » = comme convenu / comme évoqué. Participe passé seul, sans sujet : forme elliptique de « as we discussed »."},{"id":"eml-017","theme":"emails","type":"conjugate","prompt":"I ___ (to send) you the request list last Monday, but I have not received a reply yet.","answers":["sent"],"explanation":"« Last Monday » = moment terminé : past simple. La seconde partie (« not… yet ») est au present perfect car le résultat concerne le présent."},{"id":"eml-018","theme":"emails","type":"conjugate","prompt":"We ___ (not / to receive) the bank confirmation yet.","answers":["have not received","haven't received"],"explanation":"« Yet » dans une phrase négative appelle le present perfect : l'action est attendue et toujours pas réalisée."},{"id":"eml-019","theme":"emails","type":"conjugate","prompt":"I would appreciate it if you ___ (can) send the files today.","answers":["could"],"explanation":"Après « I would appreciate it if… », on emploie « could » (forme polie de « can »). N'oubliez pas le « it »."},{"id":"eml-020","theme":"emails","type":"conjugate","prompt":"I look forward to ___ (to meet) you next week.","answers":["meeting"],"explanation":"« Look forward to » + verbe en -ing : « to » est ici une préposition."},{"id":"eml-021","theme":"emails","type":"translate","direction":"fr-en","prompt":"Veuillez trouver ci-joint le rapport.","answers":["Please find attached the report.","Please find the report attached.","Please find the attached report.","Please find enclosed the report.","Please find the report enclosed."],"explanation":"« Please find attached the report » ou « Please find the report attached ». Plus direct : « I've attached the report. »"},{"id":"eml-022","theme":"emails","type":"translate","direction":"fr-en","prompt":"Cordialement,","answers":["Kind regards","Best regards","Regards","Best wishes","Warm regards"],"explanation":"« Kind regards » ou « Best regards » : formules de clôture neutres, adaptées à presque tous les mails professionnels.","term":"Kind regards,","fr":"Cordialement,"},{"id":"eml-023","theme":"emails","type":"translate","direction":"fr-en","prompt":"Merci pour votre réponse rapide.","answers":["Thank you for your quick reply.","Thank you for your prompt reply.","Thank you for your prompt response.","Thank you for your quick response.","Thanks for your quick reply.","Thanks for your prompt reply.","Thanks for your quick response.","Thanks for your prompt response.","Thank you for your swift reply.","Thank you for your swift response.","Thank you for your quick answer.","Thank you for your fast reply."],"explanation":"« Thank you for your prompt reply » : « prompt » est l'adjectif le plus professionnel pour « rapide » dans ce contexte.","term":"Thank you for your prompt reply.","fr":"Merci pour votre réponse rapide."},{"id":"eml-024","theme":"emails","type":"translate","direction":"fr-en","prompt":"une pièce jointe","answers":["an attachment"],"explanation":"« An attachment » = une pièce jointe. Le verbe est « to attach » ; « to join » veut dire rejoindre.","term":"an attachment","fr":"une pièce jointe"},{"id":"eml-025","theme":"emails","type":"translate","direction":"fr-en","prompt":"relancer un client","answers":["to chase a client","to chase up a client","to follow up with a client","to send a reminder to a client","to remind a client","to chase a customer","to follow up with a customer"],"explanation":"« To chase (up) a client » = relancer un client. Plus neutre : « to follow up with a client ».","note":"« To chase up » est surtout britannique.","term":"to chase a client","fr":"relancer un client"},{"id":"eml-026","theme":"emails","type":"translate","direction":"fr-en","prompt":"dès que possible","answers":["as soon as possible","ASAP","at your earliest convenience"],"explanation":"« As soon as possible » (ASAP). Plus courtois avec un client : « at your earliest convenience ».","term":"as soon as possible","fr":"dès que possible"},{"id":"eml-027","theme":"emails","type":"translate","direction":"fr-en","prompt":"accuser réception","answers":["to acknowledge receipt","to confirm receipt"],"explanation":"« To acknowledge receipt of » = accuser réception de. « Receipt » se prononce sans le p.","term":"to acknowledge receipt","fr":"accuser réception"},{"id":"eml-028","theme":"emails","type":"translate","direction":"en-fr","prompt":"at your earliest convenience","answers":["dès que possible","dès que vous le pourrez","à votre meilleure convenance","dans les meilleurs délais","au plus vite","dès que vous pourrez"],"explanation":"« At your earliest convenience » = dès que vous le pourrez. Formule courtoise pour demander une réponse rapide sans imposer de date.","term":"at your earliest convenience","fr":"dès que vous le pourrez"},{"id":"eml-029","theme":"emails","type":"translate","direction":"en-fr","prompt":"To whom it may concern","answers":["À qui de droit"],"explanation":"« To whom it may concern » = à qui de droit : en-tête d'une lettre ou d'une attestation sans destinataire précis.","term":"To whom it may concern","fr":"À qui de droit"},{"id":"eml-030","theme":"emails","type":"translate","direction":"en-fr","prompt":"to keep someone in the loop","answers":["tenir quelqu'un informé","tenir quelqu'un au courant","tenir informé","tenir au courant","garder quelqu'un dans la boucle","mettre quelqu'un dans la boucle","informer quelqu'un"],"explanation":"« To keep someone in the loop » = tenir quelqu'un informé. « Please keep me in the loop » = tenez-moi au courant.","term":"to keep someone in the loop","fr":"tenir quelqu'un informé"},{"id":"eml-031","theme":"emails","type":"mcq","prompt":"Vous relancez un client audité qui n'a pas envoyé les relevés bancaires. Quelle phrase convient ?","answers":["I just wanted to follow up on the bank statements we requested last week."],"distractors":["You still haven't sent the bank statements.","Send me the bank statements now.","I'm waiting the bank statements since last week."],"explanation":"« I just wanted to follow up on… » relance sans accuser. Les deux premières options sont trop directes ; la dernière est incorrecte (« waiting for », et present perfect avec « since »)."},{"id":"eml-032","theme":"emails","type":"mcq","prompt":"Quelle demande est polie sans être excessive ?","answers":["Could you please send me the fixed asset register by Wednesday?"],"distractors":["I want the fixed asset register by Wednesday.","Send the fixed asset register by Wednesday.","You must send me the fixed asset register by Wednesday."],"explanation":"« Could you please… » est la forme neutre et polie. « I want », l'impératif seul et « you must » sonnent comme des ordres. « Fixed asset register » = fichier des immobilisations."},{"id":"eml-033","theme":"emails","type":"mcq","prompt":"Vous écrivez à un service dont vous ne connaissez pas l'interlocuteur. Quelle formule d'appel choisir ?","answers":["Dear Sir or Madam,"],"distractors":["Hi guys,","Dear Mister,","Hello Sir Thompson,"],"explanation":"« Dear Sir or Madam, » quand le destinataire est inconnu. « Mister » ne s'écrit jamais en toutes lettres, et « Sir » ne se combine pas avec un nom de famille."},{"id":"eml-034","theme":"emails","type":"mcq","prompt":"Vous écrivez à une collègue proche de votre équipe. Quelle ouverture est naturelle ?","answers":["Hi Sarah,"],"distractors":["Dear Madam,","Dear Mrs Sarah,","To whom it may concern,"],"explanation":"Entre collègues, « Hi + prénom » est la norme. « Mrs / Ms / Mr » se construisent avec le nom de famille, jamais avec le prénom."},{"id":"eml-035","theme":"emails","type":"mcq","prompt":"Vous répondez avec trois jours de retard. Comment commencer ?","answers":["Apologies for the late reply."],"distractors":["Sorry for my late.","Excuse me to answer late.","I am sorry for the retard."],"explanation":"« Apologies for the late reply » ou « Sorry for the delay ». « Late » est un adjectif, pas un nom."},{"id":"eml-036","theme":"emails","type":"mcq","prompt":"Quelle phrase transmet correctement une pièce jointe ?","answers":["I've attached the updated file for your review."],"distractors":["I join you the updated file.","You will find in attached piece the updated file.","Here attached the file updated for review you."],"explanation":"« I've attached… » ou « Please find attached… ». « To join » (rejoindre) est un faux ami de « joindre »."},{"id":"eml-037","theme":"emails","type":"mcq","prompt":"Quelle formule de clôture convient pour un mail courant à un client ?","answers":["Kind regards,"],"distractors":["Kisses,","Bye bye,","With all my friendship,"],"explanation":"« Kind regards, » est la clôture professionnelle par défaut. Les traductions littérales de « bises » ou « amitiés » ne s'emploient pas dans un mail professionnel."},{"id":"eml-038","theme":"emails","type":"mcq","choices":"fr","prompt":"Que signifie « Please disregard my previous email » ?","answers":["Merci de ne pas tenir compte de mon mail précédent."],"distractors":["Merci de relire attentivement mon mail précédent.","Merci de répondre à mon mail précédent.","Merci de transférer mon mail précédent."],"explanation":"« To disregard » = ne pas tenir compte de. Utile après une erreur d'envoi ou de pièce jointe.","term":"to disregard","fr":"ne pas tenir compte de"},{"id":"eml-039","theme":"emails","type":"mcq","choices":"fr","prompt":"Dans un mail, que signifie « FYI » ?","answers":["Pour information"],"distractors":["Pour action immédiate","En attente de votre réponse","Confidentiel"],"explanation":"« FYI » = for your information : aucune action n'est attendue du destinataire.","term":"FYI (for your information)","fr":"pour information"},{"id":"eml-040","theme":"emails","type":"order","prompt":"Je vous écris pour faire suite à mon précédent mail.","answers":["I am writing to follow up on my previous email."],"explanation":"« I am writing to… » annonce l'objet du mail dès la première phrase. « To follow up on » = faire suite à."},{"id":"eml-041","theme":"emails","type":"order","prompt":"N'hésitez pas à me dire s'il vous faut autre chose.","answers":["Please let me know if you need anything else.","Let me know please if you need anything else."],"explanation":"« Let me know if you need anything else » : clôture serviable et naturelle."},{"id":"eml-042","theme":"emails","type":"order","prompt":"Pourriez-vous confirmer le montant d'ici la fin de la semaine ?","answers":["Could you confirm the amount by the end of the week?","By the end of the week could you confirm the amount?"],"explanation":"« By the end of the week » fixe une échéance claire, sans brusquer."},{"id":"eml-043","theme":"emails","type":"order","prompt":"Merci d'être revenu vers moi aussi vite.","answers":["Thank you for getting back to me so quickly."],"explanation":"« Thank you for » + verbe en -ing. « To get back to someone » = revenir vers quelqu'un."},{"id":"eml-044","theme":"emails","type":"order","prompt":"J'ai joint la facture pour référence.","answers":["I have attached the invoice for your reference.","For your reference I have attached the invoice."],"explanation":"« For your reference » = pour référence, à toutes fins utiles."},{"id":"eml-045","theme":"emails","type":"order","prompt":"Désolé d'avoir tardé à répondre à votre mail.","answers":["Sorry for the delay in replying to your email."],"explanation":"« The delay in » + verbe en -ing. « To reply to an email » : n'oubliez pas « to »."},{"id":"eml-046","theme":"emails","type":"match","pairs":[["Dear Sir or Madam,","destinataire inconnu"],["Dear Ms Clark,","cliente, registre formel"],["Hi Tom,","collègue proche"],["Hello everyone,","mail à tout un groupe"]],"explanation":"La formule d'appel donne le registre du mail. « Ms » convient à toutes les femmes, mariées ou non : c'est le choix par défaut."},{"id":"eml-047","theme":"emails","type":"match","pairs":[["attachment","pièce jointe"],["to forward","transférer"],["recipient","destinataire"],["subject line","objet du mail"]],"explanation":"Vocabulaire de base du mail : « attachment », « to forward », « recipient », « subject line »."},{"id":"eml-048","theme":"emails","type":"error","prompt":"Please find [joined] the invoice for October.","answers":["Please find attached the invoice for October."],"explanation":"Joindre un fichier = « to attach ». « To join » = rejoindre (une équipe, une réunion)."},{"id":"eml-049","theme":"emails","type":"error","prompt":"I am looking forward to [hear] from you soon.","answers":["I am looking forward to hearing from you soon."],"explanation":"« Look forward to » + verbe en -ing : « hearing », pas « hear »."},{"id":"eml-050","theme":"emails","type":"error","prompt":"I will send you the reconciliation [until] tomorrow noon.","answers":["I will send you the reconciliation by tomorrow noon."],"explanation":"Pour une échéance : « by » (au plus tard). « Until » exprime une durée : « I will be in meetings until noon. »"},{"id":"eml-051","theme":"emails","type":"error","prompt":"Dear [Mister] Brown, thank you for your email.","answers":["Dear Mr Brown, thank you for your email."],"explanation":"Dans une formule d'appel, on écrit toujours l'abréviation : « Mr », « Ms », « Mrs ».","note":"GB : Mr, Ms (sans point) · US : Mr., Ms. (avec point)"},{"id":"eml-052","theme":"emails","type":"dictation","answers":["Please find attached the latest version of the file."],"explanation":"« The latest version » = la dernière version en date. « The last version » laisserait entendre qu'il n'y en aura plus."},{"id":"eml-053","theme":"emails","type":"dictation","answers":["Thanks in advance for your help."],"explanation":"« Thanks in advance » : un peu plus familier que « Thank you in advance »."},{"id":"eml-054","theme":"emails","type":"dictation","answers":["Let me know if you have any questions."],"explanation":"Clôture simple et naturelle. On emploie « any » après « if »."},{"id":"eml-055","theme":"emails","type":"listen","audio":"I'm chasing the bank confirmations we still haven't received.","prompt":"Que fait la personne ?","answers":["Elle relance au sujet de documents non reçus."],"distractors":["Elle confirme la réception des documents.","Elle annule sa demande de documents.","Elle remercie pour l'envoi des documents."],"explanation":"« To chase » = relancer. « Bank confirmations » = confirmations bancaires (circularisation des banques)."},{"id":"eml-056","theme":"emails","type":"listen","audio":"Could you get back to me by close of business today?","prompt":"Quand la réponse est-elle attendue ?","answers":["Avant la fin de la journée de travail"],"distractors":["Avant la fermeture définitive de l'entreprise","Demain matin à l'ouverture","Avant la fin de la semaine"],"explanation":"« Close of business » (COB) = la fin de la journée de travail. On voit aussi « end of day » (EOD).","term":"by close of business (COB)","fr":"avant la fin de la journée de travail"}]},{"id":"controlling","title":"Contrôle de gestion","icon":"📊","description":"Budget, forecast, actuals, analyse des écarts, KPI, P&L, EBITDA, centres de coûts, clôture mensuelle, reporting, effectifs, run rate, YTD.","items":[{"id":"cdg-001","theme":"controlling","type":"fill","prompt":"Revenue came in 4% ___ budget, mainly due to delayed orders.","hint":"en dessous de","answers":["below","under","behind"],"explanation":"« Below budget » = inférieur au budget ; « above / over budget » = supérieur. « To come in » = s'établir à (pour un chiffre réalisé).","term":"below budget","fr":"inférieur au budget"},{"id":"cdg-002","theme":"controlling","type":"fill","prompt":"We need to compare the ___ with the budget for each cost centre.","hint":"le réel, les chiffres réalisés","answers":["actuals","actual figures","actual"],"explanation":"« Actuals » = les chiffres réels, par opposition au budget et au forecast. Rien à voir avec « actuel » (current).","term":"actuals","fr":"le réel, les réalisations"},{"id":"cdg-003","theme":"controlling","type":"fill","prompt":"A ___ variance means that costs were lower than budgeted.","hint":"écart qui améliore le résultat","answers":["favourable","favorable","positive"],"explanation":"Un écart favorable améliore le résultat : moins de coûts ou plus de revenus que prévu.","note":"GB : favourable · US : favorable","term":"a favourable variance","fr":"un écart favorable"},{"id":"cdg-004","theme":"controlling","type":"fill","prompt":"An ___ variance on raw materials reduced the gross margin.","hint":"défavorable (commence par a)","answers":["adverse"],"explanation":"Un écart défavorable (« adverse variance ») dégrade le résultat. « Raw materials » = matières premières.","note":"GB : adverse variance · US : unfavorable variance","term":"an adverse variance","fr":"un écart défavorable"},{"id":"cdg-005","theme":"controlling","type":"fill","prompt":"The updated ___ shows full-year sales of 48 million euros.","hint":"prévision","answers":["forecast","reforecast","outlook"],"explanation":"« Forecast » = prévision actualisée en cours d'année. « Reforecast » insiste sur le fait qu'on la refait.","term":"a forecast","fr":"une prévision"},{"id":"cdg-006","theme":"controlling","type":"fill","prompt":"Month-end ___ takes five working days in our entity.","hint":"clôture","answers":["closing","close"],"explanation":"« Month-end closing » = la clôture mensuelle. « To close the books » = clôturer les comptes.","note":"GB : month-end closing · US : month-end close","term":"month-end closing","fr":"clôture mensuelle"},{"id":"cdg-007","theme":"controlling","type":"fill","prompt":"Total ___ rose from 210 to 225 full-time equivalents.","hint":"effectifs","answers":["headcount"],"explanation":"« Headcount » = les effectifs. « Full-time equivalent » (FTE) = équivalent temps plein (ETP).","term":"headcount","fr":"effectifs"},{"id":"cdg-008","theme":"controlling","type":"fill","prompt":"Based on the current run ___, we will exceed the annual target.","hint":"taux, rythme","answers":["rate"],"explanation":"« Run rate » = extrapolation annuelle du rythme actuel (par exemple le dernier mois multiplié par douze).","term":"run rate","fr":"rythme annualisé"},{"id":"cdg-009","theme":"controlling","type":"fill","prompt":"Year to ___, operating expenses are 2% over budget.","hint":"cumul à ce jour : year to ___","answers":["date"],"explanation":"« Year to date » (YTD) = cumul depuis le début de l'exercice. De même : MTD (month to date).","term":"year to date (YTD)","fr":"cumul depuis le début de l'exercice"},{"id":"cdg-010","theme":"controlling","type":"fill","prompt":"Overhead costs are ___ to each business unit based on headcount.","hint":"répartis, affectés","answers":["allocated","apportioned","charged"],"explanation":"« To allocate costs to » = affecter, répartir des coûts. La clé de répartition se dit « allocation key ».","term":"to allocate costs","fr":"répartir, affecter des coûts"},{"id":"cdg-011","theme":"controlling","type":"fill","prompt":"Each manager is responsible for the expenses of their cost ___.","hint":"pôle, unité de suivi des charges (orthographe GB ou US)","answers":["centre","center"],"explanation":"« Cost centre » = centre de coûts ; « profit centre » = centre de profit.","note":"GB : cost centre · US : cost center","term":"a cost centre","fr":"un centre de coûts"},{"id":"cdg-012","theme":"controlling","type":"fill","prompt":"The reporting ___ must be submitted to head office by day five.","hint":"liasse, dossier","answers":["package","pack"],"explanation":"« Reporting package » = la liasse de reporting envoyée au siège (head office) à chaque clôture.","term":"the reporting package","fr":"la liasse de reporting"},{"id":"cdg-013","theme":"controlling","type":"fill","prompt":"EBITDA stands for earnings before interest, taxes, depreciation and ___.","hint":"amortissement des incorporels","answers":["amortisation","amortization"],"explanation":"« Depreciation » concerne les immobilisations corporelles, « amortisation » les incorporelles. L'EBITDA est proche de l'EBE français, sans lui être identique.","note":"GB : amortisation · US : amortization","term":"EBITDA","fr":"résultat avant intérêts, impôts et amortissements (proche de l'EBE)"},{"id":"cdg-014","theme":"controlling","type":"fill","bank":true,"prompt":"The ___ shows revenue, costs and profit for the period.","answers":["P&L"],"distractors":["balance sheet","cash flow statement","trial balance"],"explanation":"« P&L » (profit and loss) = compte de résultat. « Balance sheet » = bilan ; « trial balance » = balance générale.","note":"GB : profit and loss account · US : income statement"},{"id":"cdg-015","theme":"controlling","type":"fill","bank":true,"prompt":"We ___ the full-year forecast every quarter.","answers":["update"],"distractors":["actualize","actual","current"],"explanation":"Actualiser une prévision = « to update a forecast ». « To actualize » existe mais signifie « concrétiser » : c'est un faux ami."},{"id":"cdg-016","theme":"controlling","type":"fill","bank":true,"prompt":"The variance is mainly ___ by higher energy prices.","answers":["driven"],"distractors":["drove","driving","drive"],"explanation":"« To be driven by » = s'expliquer par, être tiré par. Passif : be + participe passé (driven)."},{"id":"cdg-017","theme":"controlling","type":"conjugate","prompt":"Last month, travel expenses ___ (to exceed) the budget by 12%.","answers":["exceeded"],"explanation":"« Last month » = période terminée : past simple. « By 12% » indique l'ampleur de l'écart."},{"id":"cdg-018","theme":"controlling","type":"conjugate","prompt":"So far this year, we ___ (to hire) fifteen new employees.","answers":["have hired"],"explanation":"« So far this year » = période non terminée : present perfect."},{"id":"cdg-019","theme":"controlling","type":"conjugate","prompt":"If sales ___ (to remain) flat, we will miss the target.","answers":["remain"],"explanation":"Après « if » (condition réelle), on emploie le présent, pas le futur. « Flat » = stable."},{"id":"cdg-020","theme":"controlling","type":"conjugate","prompt":"The forecast ___ (to revise, passif) twice since March.","answers":["has been revised"],"explanation":"« Since March » appelle le present perfect ; la prévision subit l'action, d'où le passif : has been + participe passé."},{"id":"cdg-021","theme":"controlling","type":"conjugate","prompt":"By the end of the year, we ___ (to save) 2 million euros.","answers":["will have saved"],"explanation":"« By the end of the year » + action accomplie d'ici là : futur antérieur (will have + participe passé)."},{"id":"cdg-022","theme":"controlling","type":"translate","direction":"fr-en","prompt":"l'analyse des écarts","answers":["variance analysis","analysis of variances"],"explanation":"« Variance analysis » = analyse des écarts entre le réel et le budget (ou le forecast).","term":"variance analysis","fr":"analyse des écarts"},{"id":"cdg-023","theme":"controlling","type":"translate","direction":"fr-en","prompt":"le compte de résultat","answers":["the P&L","the income statement","the profit and loss account","the profit and loss statement","the P&L statement","the P&L account","the statement of profit or loss"],"explanation":"Au quotidien : « the P&L ». Dans les états financiers IFRS : « statement of profit or loss ».","note":"GB : profit and loss account · US : income statement","term":"the P&L","fr":"le compte de résultat"},{"id":"cdg-024","theme":"controlling","type":"translate","direction":"fr-en","prompt":"le chiffre d'affaires","answers":["revenue","turnover","sales","revenues","net sales"],"explanation":"« Revenue » est le terme IFRS. Attention : « turnover » signifie aussi rotation (du personnel, des stocks).","note":"GB : turnover (courant) · US : revenue, sales","term":"revenue","fr":"chiffre d'affaires"},{"id":"cdg-025","theme":"controlling","type":"translate","direction":"fr-en","prompt":"les frais généraux","answers":["overheads","overhead","overhead costs","overhead expenses"],"explanation":"« Overheads » = frais généraux, coûts indirects de structure.","note":"GB : overheads · US : overhead","term":"overheads","fr":"frais généraux"},{"id":"cdg-026","theme":"controlling","type":"translate","direction":"fr-en","prompt":"la marge brute","answers":["gross margin","gross profit"],"explanation":"« Gross margin » = marge brute (souvent en %) ; « gross profit » = le montant correspondant.","term":"gross margin","fr":"marge brute"},{"id":"cdg-027","theme":"controlling","type":"translate","direction":"fr-en","prompt":"Les coûts sont supérieurs au budget.","answers":["Costs are over budget.","Costs are above budget.","Costs are higher than budget.","The costs are over budget.","The costs are above budget.","Costs exceed the budget.","Costs exceed budget.","Costs are higher than budgeted.","Costs are above the budget.","Costs are over the budget.","Costs are higher than the budget.","The costs are higher than the budget.","The costs exceed the budget."],"explanation":"« Over budget » / « above budget » = supérieur au budget. Sans article dans l'expression figée."},{"id":"cdg-028","theme":"controlling","type":"translate","direction":"fr-en","prompt":"un indicateur clé de performance","answers":["a key performance indicator","a KPI"],"explanation":"« KPI » = key performance indicator. On dit « to track / monitor a KPI » (suivre un indicateur).","term":"a KPI (key performance indicator)","fr":"un indicateur clé de performance"},{"id":"cdg-029","theme":"controlling","type":"translate","direction":"en-fr","prompt":"a cost centre","answers":["un centre de coûts","un centre de coût"],"explanation":"« Cost centre » = centre de coûts : unité dont on suit les charges.","note":"GB : centre · US : center"},{"id":"cdg-030","theme":"controlling","type":"translate","direction":"en-fr","prompt":"the month-end closing","answers":["la clôture mensuelle","la clôture de fin de mois","la clôture du mois","la clôture mensuelle des comptes"],"explanation":"« Month-end closing » = clôture mensuelle. De même : quarter-end, year-end closing."},{"id":"cdg-031","theme":"controlling","type":"translate","direction":"en-fr","prompt":"a shortfall","answers":["un manque à gagner","un déficit","une insuffisance","un manque","un écart négatif"],"explanation":"« A shortfall » = un manque par rapport à ce qui était attendu : « a revenue shortfall of €2m ».","term":"a shortfall","fr":"un manque à gagner, un déficit"},{"id":"cdg-032","theme":"controlling","type":"mcq","choices":"fr","prompt":"Que signifie « YTD » dans un reporting ?","answers":["Year to date : cumul depuis le début de l'exercice"],"distractors":["Yearly total difference : écart annuel total","Yield to date : rendement à ce jour","Year target defined : objectif annuel fixé"],"explanation":"« YTD » = year to date. On compare souvent « YTD actuals » et « YTD budget »."},{"id":"cdg-033","theme":"controlling","type":"mcq","prompt":"Les coûts réels dépassent le budget. Quel terme britannique décrit cet écart ?","answers":["an adverse variance"],"distractors":["a favourable variance","a flat variance","a fixed variance"],"explanation":"Coûts supérieurs au budget = écart défavorable : « adverse variance » (GB) ou « unfavorable variance » (US)."},{"id":"cdg-034","theme":"controlling","type":"mcq","choices":"fr","prompt":"Quelle est la différence entre « budget » et « forecast » ?","answers":["Le budget est l'objectif fixé avant l'exercice ; le forecast est la prévision actualisée en cours d'année."],"distractors":["Le budget concerne les coûts ; le forecast concerne les ventes.","Le budget est mensuel ; le forecast est annuel.","Ce sont deux synonymes exacts."],"explanation":"Le budget est figé en début d'exercice. Le forecast (ou reforecast) est révisé à mesure que le réel est connu."},{"id":"cdg-035","theme":"controlling","type":"mcq","prompt":"Quelle phrase commente correctement un écart ?","answers":["The adverse variance is mainly due to higher freight costs."],"distractors":["The adverse variance is mainly due to freight costs are higher.","The adverse variance is mainly because higher freight costs.","The adverse variance is mainly due of higher freight costs."],"explanation":"« Due to » + groupe nominal. Avec une proposition, il faudrait « because freight costs are higher ». « Freight » = transport de marchandises."},{"id":"cdg-036","theme":"controlling","type":"mcq","choices":"fr","prompt":"Que désigne « FTE » ?","answers":["Full-time equivalent : équivalent temps plein"],"distractors":["Fixed-term employee : salarié en CDD","Financial target estimate : estimation de l'objectif financier","Full-year total expenses : charges totales de l'exercice"],"explanation":"« FTE » = full-time equivalent (ETP). Deux mi-temps comptent pour 1 FTE.","term":"FTE (full-time equivalent)","fr":"ETP (équivalent temps plein)"},{"id":"cdg-037","theme":"controlling","type":"mcq","prompt":"We are ___ track to meet the full-year target.","answers":["on"],"distractors":["in","at","under"],"explanation":"« To be on track » = être en bonne voie (pour atteindre un objectif). Contraire : « to be off track ».","term":"to be on track","fr":"être en bonne voie"},{"id":"cdg-038","theme":"controlling","type":"mcq","prompt":"Quelle expression signifie « une ventilation des coûts par service » ?","answers":["a cost breakdown by department"],"distractors":["a cost ventilation by department","a costs repartition by service","a cost breakdown per services"],"explanation":"« A breakdown » = une ventilation, une décomposition. « Ventilation » en anglais désigne l'aération.","term":"a breakdown","fr":"une ventilation, une décomposition"},{"id":"cdg-039","theme":"controlling","type":"order","prompt":"Le chiffre d'affaires était supérieur de cinq pour cent au budget en mars.","answers":["Revenue was five percent above budget in March.","In March revenue was five percent above budget."],"explanation":"Structure type d'un commentaire : indicateur + was + écart + above / below budget + période."},{"id":"cdg-040","theme":"controlling","type":"order","prompt":"L'écart s'explique principalement par des volumes plus faibles.","answers":["The variance is mainly due to lower volumes."],"explanation":"« Mainly due to » = principalement dû à. « Mainly » se place avant « due »."},{"id":"cdg-041","theme":"controlling","type":"order","prompt":"Nous devons actualiser la prévision avant le conseil d'administration.","answers":["We need to update the forecast before the board meeting.","Before the board meeting we need to update the forecast."],"explanation":"« Board meeting » = réunion du conseil d'administration. « To update » = actualiser."},{"id":"cdg-042","theme":"controlling","type":"order","prompt":"Les charges d'exploitation sont conformes au budget.","answers":["Operating expenses are in line with the budget."],"explanation":"« In line with » = conforme à, en ligne avec. « Operating expenses » (opex) = charges d'exploitation.","term":"in line with the budget","fr":"conforme au budget"},{"id":"cdg-043","theme":"controlling","type":"order","prompt":"Pourriez-vous ventiler les coûts par service ?","answers":["Could you break down the costs by department?","Could you break the costs down by department?"],"explanation":"« To break down » = ventiler, décomposer. Le complément peut se placer avant ou après « down »."},{"id":"cdg-044","theme":"controlling","type":"order","prompt":"Les effectifs ont augmenté depuis l
