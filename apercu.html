 ». « A stage » désigne une scène de théâtre ou une étape.","note":"GB : on dit aussi « a work placement »","term":"an internship","fr":"un stage"},{"id":"ffr-014","theme":"false-friends","type":"fill","prompt":"All new joiners attend a two-week ___ course.","hint":"formation","answers":["training","induction"],"explanation":"La formation = « training » (indénombrable). « Formation » en anglais = la constitution, la création (company formation).","term":"training","fr":"formation"},{"id":"ffr-015","theme":"false-friends","type":"fill","prompt":"She works for a large insurance ___ based in London.","hint":"société, entreprise","answers":["company","firm","group","business"],"explanation":"Une société (entreprise) = « a company ». « Society » désigne la société au sens social.","term":"a company","fr":"une société, une entreprise"},{"id":"ffr-016","theme":"false-friends","type":"fill","prompt":"It depends ___ the exchange rate.","hint":"préposition","answers":["on","upon"],"explanation":"« To depend ON » : jamais « depend of »."},{"id":"ffr-017","theme":"false-friends","type":"fill","prompt":"Who is responsible ___ the monthly reporting?","hint":"préposition","answers":["for"],"explanation":"« Responsible FOR » : jamais « responsible of »."},{"id":"ffr-018","theme":"false-friends","type":"fill","prompt":"I'm interested ___ a career in audit.","hint":"préposition","answers":["in"],"explanation":"« Interested IN » : jamais « interested by »."},{"id":"ffr-019","theme":"false-friends","type":"fill","bank":true,"prompt":"You can borrow this book for free from the ___.","answers":["library"],"distractors":["bookshop","bookstore","stationery"],"explanation":"« Library » = bibliothèque (on y emprunte). La librairie, où l'on achète, se dit « bookshop » (GB) ou « bookstore » (US)."},{"id":"ffr-020","theme":"false-friends","type":"fill","bank":true,"prompt":"In American English, a CV is usually called a ___.","answers":["résumé"],"distractors":["summary","curriculum","abstract"],"explanation":"« A résumé » (US) = un CV. Un résumé de texte se dit « a summary ».","note":"GB : CV · US : résumé (aussi écrit resume)"},{"id":"ffr-021","theme":"false-friends","type":"fill","bank":true,"prompt":"She gave me some useful ___ about the interview.","answers":["advice"],"distractors":["advices","advise","an advice"],"explanation":"« Advice » (nom) est indénombrable : some advice, a piece of advice. « To advise » (avec un s) est le verbe."},{"id":"ffr-022","theme":"false-friends","type":"conjugate","prompt":"I ___ (to work) here since September.","answers":["have worked","have been working"],"explanation":"« Depuis » + action toujours en cours : present perfect (simple ou continu). Jamais le présent : « I work here since » est faux."},{"id":"ffr-023","theme":"false-friends","type":"conjugate","prompt":"We ___ (to wait) for the client's answer for two weeks now.","answers":["have been waiting","have waited"],"explanation":"Action commencée dans le passé et qui dure encore : present perfect continu. Notez « to wait FOR »."},{"id":"ffr-024","theme":"false-friends","type":"conjugate","prompt":"I ___ (to know) my manager for five years.","answers":["have known"],"explanation":"« Know » est un verbe d'état : pas de forme en -ing. Present perfect simple avec « for »."},{"id":"ffr-025","theme":"false-friends","type":"conjugate","prompt":"He ___ (to join) the firm three years ago.","answers":["joined"],"explanation":"« Ago » situe l'action à un moment précis du passé : past simple obligatoire (jamais de present perfect avec « ago »)."},{"id":"ffr-026","theme":"false-friends","type":"conjugate","prompt":"People ___ (to be) often surprised by this rule.","answers":["are"],"explanation":"« People » est un pluriel : people are, people think. « The people is » est une erreur."},{"id":"ffr-027","theme":"false-friends","type":"translate","direction":"fr-en","prompt":"actuellement","answers":["currently","at the moment","at present","presently","right now","now"],"reject":["actually"],"explanation":"« Actuellement » = « currently » ou « at the moment ». « Actually » veut dire « en fait »."},{"id":"ffr-028","theme":"false-friends","type":"translate","direction":"fr-en","prompt":"une librairie","answers":["a bookshop","a bookstore","a book shop"],"reject":["a library"],"explanation":"Une librairie = « a bookshop ». « A library » est une bibliothèque.","note":"GB : bookshop · US : bookstore","term":"a bookshop","fr":"une librairie"},{"id":"ffr-029","theme":"false-friends","type":"translate","direction":"fr-en","prompt":"des informations","answers":["information","some information"],"reject":["informations","some informations"],"explanation":"« Information » est indénombrable : jamais de -s, jamais « an information ». Pour compter : « a piece of information ».","term":"some information","fr":"des informations"},{"id":"ffr-030","theme":"false-friends","type":"translate","direction":"fr-en","prompt":"un conseil","answers":["a piece of advice","some advice","advice","a tip","a recommendation"],"reject":["an advice","advices","an advise","advise"],"explanation":"« Advice » est indénombrable : « a piece of advice » ou « some advice ».","term":"a piece of advice","fr":"un conseil"},{"id":"ffr-031","theme":"false-friends","type":"translate","direction":"fr-en","prompt":"assister à une réunion","answers":["to attend a meeting","to join a meeting","to be at a meeting","to go to a meeting","to take part in a meeting"],"reject":["to assist to a meeting","to assist a meeting","assist a meeting","assist to a meeting","to assist at a meeting"],"explanation":"Assister à = « to attend » (sans préposition). « To assist » = aider.","term":"to attend a meeting","fr":"assister à une réunion"},{"id":"ffr-032","theme":"false-friends","type":"translate","direction":"fr-en","prompt":"Cela dépend du client.","answers":["It depends on the client.","That depends on the client.","It depends on the customer.","This depends on the client.","That depends on the customer."],"explanation":"« It depends ON » : la préposition est toujours « on »."},{"id":"ffr-033","theme":"false-friends","type":"translate","direction":"fr-en","prompt":"un milliard d'euros","answers":["a billion euros","one billion euros","1 billion euros","€1 billion","€1bn","EUR 1 billion"],"explanation":"Un milliard = « a billion ». Le « billion » français (mille milliards) se dit « a trillion ».","term":"a billion","fr":"un milliard"},{"id":"ffr-034","theme":"false-friends","type":"translate","direction":"fr-en","prompt":"se rendre compte de quelque chose","answers":["to realise something","to realize something","to notice something","to become aware of something"],"explanation":"« To realise » = se rendre compte. Réaliser un projet = « to carry out » ou « to complete a project ».","note":"GB : realise · US : realize","term":"to realise","fr":"se rendre compte"},{"id":"ffr-035","theme":"false-friends","type":"translate","direction":"en-fr","prompt":"eventually","answers":["finalement","en fin de compte","au bout du compte","à la fin","en définitive","au final","à terme"],"explanation":"« Eventually » = finalement. Éventuellement = « possibly »."},{"id":"ffr-036","theme":"false-friends","type":"translate","direction":"en-fr","prompt":"sensible","answers":["raisonnable","sensé","sensée","judicieux","judicieuse"],"explanation":"« Sensible » = raisonnable, sensé. Sensible = « sensitive »."},{"id":"ffr-037","theme":"false-friends","type":"translate","direction":"en-fr","prompt":"to achieve","answers":["atteindre","réaliser","accomplir","obtenir","réussir"],"explanation":"« To achieve » = atteindre, réaliser (un objectif, un résultat). Achever = « to complete »."},{"id":"ffr-038","theme":"false-friends","type":"translate","direction":"en-fr","prompt":"a library","answers":["une bibliothèque"],"explanation":"« A library » = une bibliothèque.","term":"a library","fr":"une bibliothèque"},{"id":"ffr-039","theme":"false-friends","type":"translate","direction":"en-fr","prompt":"comprehensive","answers":["complet","complète","exhaustif","exhaustive","détaillé","détaillée","global","globale"],"explanation":"« Comprehensive » = complet, exhaustif (a comprehensive report). Compréhensif = « understanding ». En IFRS : « other comprehensive income » = autres éléments du résultat global.","term":"comprehensive","fr":"complet, exhaustif"},{"id":"ffr-040","theme":"false-friends","type":"mcq","choices":"fr","prompt":"Que signifie « I'm actually working on the budget » ?","answers":["En fait, je travaille sur le budget."],"distractors":["Actuellement, je travaille sur le budget.","Je travaille activement sur le budget.","Je vais bientôt travailler sur le budget."],"explanation":"« Actually » = en fait. Pour « actuellement », on dirait « I'm currently working on the budget »."},{"id":"ffr-041","theme":"false-friends","type":"mcq","prompt":"The auditor ___ the invoices against the purchase orders.","answers":["checked"],"distractors":["controlled","commanded","mastered"],"explanation":"« To check something against something » = rapprocher, vérifier par comparaison. « To control » ne convient pas pour une vérification."},{"id":"ffr-042","theme":"false-friends","type":"mcq","prompt":"« Le client exige un remboursement. » Quelle est la bonne traduction ?","answers":["The client is demanding a refund."],"distractors":["The client is asking a refund.","The client is commanding a refund.","The client is pretending a refund."],"explanation":"« To demand » = exiger (beaucoup plus fort que « demander »). Demander = « to ask FOR something »."},{"id":"ffr-043","theme":"false-friends","type":"mcq","choices":"fr","prompt":"Que signifie « He pretended to understand » ?","answers":["Il a fait semblant de comprendre."],"distractors":["Il a affirmé avoir compris.","Il a essayé de comprendre.","Il a fini par comprendre."],"explanation":"« To pretend » = faire semblant. Prétendre (affirmer) = « to claim ».","term":"to pretend","fr":"faire semblant"},{"id":"ffr-044","theme":"false-friends","type":"mcq","prompt":"We received ___ from the bank.","answers":["a lot of information"],"distractors":["many informations","a lot of informations","several information"],"explanation":"« Information » est indénombrable : a lot of information, some information, much information."},{"id":"ffr-045","theme":"false-friends","type":"mcq","prompt":"La livraison a eu du retard. Comment dit-on « un retard » ?","answers":["a delay"],"distractors":["a retard","a late","a lateness time"],"explanation":"Un retard = « a delay ». Un délai (date limite) = « a deadline » ; un délai (durée) = « a time frame », « a lead time »."},{"id":"ffr-046","theme":"false-friends","type":"mcq","prompt":"The report must be ___ by Friday.","answers":["completed"],"distractors":["achieved","succeeded","resumed"],"explanation":"Achever, terminer = « to complete ». « To achieve » s'emploie pour un objectif ou un résultat, pas pour un document."},{"id":"ffr-047","theme":"false-friends","type":"mcq","choices":"fr","prompt":"Que signifie « a consistent approach » ?","answers":["une approche cohérente"],"distractors":["une approche consistante","une approche insistante","une approche coûteuse"],"explanation":"« Consistent » = cohérent, constant. En comptabilité : « consistency » = la permanence des méthodes.","term":"consistent","fr":"cohérent, constant"},{"id":"ffr-048","theme":"false-friends","type":"mcq","prompt":"Comment écrit-on « 1,5 million » en anglais ?","answers":["1.5 million"],"distractors":["1,5 million","1.5 millions","1,5 millions"],"explanation":"En anglais, le séparateur décimal est le point, et la virgule sépare les milliers (1,500.25). « Million » reste invariable après un nombre."},{"id":"ffr-049","theme":"false-friends","type":"mcq","prompt":"The project was delayed ___ the strike.","answers":["because of"],"distractors":["because","thanks of","due of"],"explanation":"« Because of » + nom = à cause de ; « because » seul introduit une proposition (because there was a strike). « Thanks to » = grâce à, réservé à une cause positive."},{"id":"ffr-050","theme":"false-friends","type":"mcq","prompt":"« Je suis ici depuis lundi. » Quelle est la bonne traduction ?","answers":["I have been here since Monday."],"distractors":["I am here since Monday.","I was here since Monday.","I am being here since Monday."],"explanation":"« Depuis » + situation toujours vraie : present perfect. Le présent simple est impossible avec « since »."},{"id":"ffr-051","theme":"false-friends","type":"order","prompt":"Je travaille ici depuis deux ans.","answers":["I have been working here for two years.","For two years I have been working here."],"explanation":"Present perfect continu + « for » + durée."},{"id":"ffr-052","theme":"false-friends","type":"order","prompt":"Pourriez-vous m'expliquer cette écriture ?","answers":["Could you explain this entry to me?"],"explanation":"« To explain something TO someone » : on ne dit pas « explain me ». Le complément direct vient d'abord."},{"id":"ffr-053","theme":"false-friends","type":"order","prompt":"Nous avons besoin de plus d'informations sur le projet.","answers":["We need more information about the project."],"explanation":"« More information » : toujours au singulier."},{"id":"ffr-054","theme":"false-friends","type":"order","prompt":"Elle est responsable de la clôture mensuelle.","answers":["She is responsible for the monthly closing."],"explanation":"« Responsible for » + nom ou verbe en -ing."},{"id":"ffr-055","theme":"false-friends","type":"order","prompt":"Cela dépend de la taille de l'entreprise.","answers":["It depends on the size of the company."],"explanation":"« It depends on » + nom."},{"id":"ffr-056","theme":"false-friends","type":"order","prompt":"J'ai fait un stage dans un cabinet d'audit.","answers":["I did an internship in an audit firm."],"explanation":"« To do an internship » : avec « do », pas « make »."},{"id":"ffr-057","theme":"false-friends","type":"match","pairs":[["actually","en fait"],["currently","actuellement"],["eventually","finalement"],["possibly","éventuellement"]],"explanation":"Les deux paires de faux amis les plus fréquentes dans les mails de francophones."},{"id":"ffr-058","theme":"false-friends","type":"match","pairs":[["sensible","raisonnable"],["sensitive","sensible"],["library","bibliothèque"],["bookshop","librairie"]],"explanation":"« Sensible » / « sensitive » et « library » / « bookshop » : deux couples à ne pas inverser."},{"id":"ffr-059","theme":"false-friends","type":"match","pairs":[["to attend","assister à"],["to assist","aider"],["to summarise","résumer"],["to resume","reprendre"]],"explanation":"« To resume work » = reprendre le travail. « To summarise a report » = résumer un rapport."},{"id":"ffr-060","theme":"false-friends","type":"match","pairs":[["a delay","un retard"],["a deadline","une date limite"],["a figure","un chiffre"],["an issue","un problème"]],"explanation":"« Figures » = les chiffres ; « an issue » = un problème, un sujet à traiter."},{"id":"ffr-061","theme":"false-friends","type":"error","prompt":"We received a lot of [informations] from the client.","answers":["We received a lot of information from the client."],"explanation":"« Information » ne prend jamais de -s."},{"id":"ffr-062","theme":"false-friends","type":"error","prompt":"I have worked here [since] five years.","answers":["I have worked here for five years."],"explanation":"« Five years » est une durée : « for ». « Since » introduit un point de départ (since 2020)."},{"id":"ffr-063","theme":"false-friends","type":"error","prompt":"The fee depends [of] the audit scope.","answers":["The fee depends on the audit scope."],"explanation":"« To depend on ». « Fee » = honoraires ; « scope » = périmètre."},{"id":"ffr-064","theme":"false-friends","type":"error","prompt":"We must [do] an effort to meet the deadline.","answers":["We must make an effort to meet the deadline."],"explanation":"« To make an effort », comme « to make a mistake », « to make progress », « to make a profit »."},{"id":"ffr-065","theme":"false-friends","type":"error","prompt":"Could you give me [an] advice on this matter?","answers":["Could you give me some advice on this matter?"],"explanation":"« Advice » est indénombrable : « some advice » ou « a piece of advice », jamais « an advice »."},{"id":"ffr-066","theme":"false-friends","type":"error","prompt":"[The] last year, revenue grew by 5%.","answers":["Last year, revenue grew by 5%."],"explanation":"Pas d'article devant « last year », « next week », « last month ». « The last year » signifierait « la dernière année » (d'une série)."},{"id":"ffr-067","theme":"false-friends","type":"error","prompt":"The group employs ten [thousands] people worldwide.","answers":["The group employs ten thousand people worldwide."],"explanation":"« Hundred », « thousand », « million » sont invariables après un nombre : ten thousand, two million."},{"id":"ffr-068","theme":"false-friends","type":"dictation","answers":["I have been working here since January.","I've been working here since January."],"explanation":"Present perfect continu + « since » + point de départ."},{"id":"ffr-069","theme":"false-friends","type":"dictation","answers":["We need more information about this client."],"explanation":"« Information » : toujours au singulier."},{"id":"ffr-070","theme":"false-friends","type":"dictation","answers":["It depends on the exchange rate."],"explanation":"« Exchange rate » = taux de change."},{"id":"ffr-071","theme":"false-friends","type":"listen","audio":"Eventually, the client agreed to adjust the accounts.","prompt":"Que s'est-il passé ?","answers":["Le client a fini par accepter de corriger les comptes."],"distractors":["Le client acceptera peut-être de corriger les comptes.","Le client a immédiatement accepté de corriger les comptes.","Le client a refusé de corriger les comptes."],"explanation":"« Eventually » = finalement, après un certain temps."},{"id":"ffr-072","theme":"false-friends","type":"listen","audio":"Actually, the deadline is tomorrow, not Friday.","prompt":"Que dit la personne ?","answers":["En réalité, l'échéance est demain."],"distractors":["Actuellement, l'échéance est vendredi.","L'échéance a été repoussée à vendredi.","L'échéance est aujourd'hui."],"explanation":"« Actually » introduit une rectification : en fait, en réalité."}]},{"id":"grammar","title":"Grammaire utile en contexte","icon":"🧩","description":"Present perfect ou past simple dans un reporting, futur et modaux pour les prévisions, formes polies, passif des rapports d'audit, prépositions de temps.","items":[{"id":"grm-001","theme":"grammar","type":"conjugate","prompt":"In 2023, the group ___ (to acquire) two subsidiaries in Spain.","answers":["acquired"],"explanation":"Date passée et terminée (in 2023) : past simple. Le present perfect est impossible avec une date précise."},{"id":"grm-002","theme":"grammar","type":"conjugate","prompt":"Since the acquisition, margins ___ (to improve) significantly.","answers":["have improved"],"explanation":"« Since » + point de départ, avec un effet qui dure jusqu'à maintenant : present perfect."},{"id":"grm-003","theme":"grammar","type":"conjugate","prompt":"We ___ (to send, avec « already ») the confirmation letters; the banks should reply soon.","answers":["have already sent"],"explanation":"« Already » se place entre l'auxiliaire et le participe passé : have already sent. Le résultat compte pour le présent : present perfect."},{"id":"grm-004","theme":"grammar","type":"conjugate","prompt":"Yesterday the CFO ___ (to approve) the final version of the report.","answers":["approved"],"explanation":"« Yesterday » : moment terminé, donc past simple."},{"id":"grm-005","theme":"grammar","type":"conjugate","prompt":"This is the first time the entity ___ (to report) a loss.","answers":["has reported"],"explanation":"Après « This is the first time », on emploie le present perfect (et non le présent, contrairement au français)."},{"id":"grm-006","theme":"grammar","type":"conjugate","prompt":"Revenue ___ (to grow) by 4% last quarter.","answers":["grew"],"explanation":"« Last quarter » = période terminée : past simple. Verbe irrégulier : grow – grew – grown."},{"id":"grm-007","theme":"grammar","type":"conjugate","prompt":"We expect that sales ___ (to reach) €50m next year.","answers":["will reach"],"explanation":"Prévision : will + base verbale."},{"id":"grm-008","theme":"grammar","type":"conjugate","prompt":"The order book is full: we ___ (to exceed, avec « be going to ») our target this year.","answers":["are going to exceed","'re going to exceed"],"explanation":"« Be going to » exprime une prévision fondée sur un indice présent (ici, le carnet de commandes)."},{"id":"grm-009","theme":"grammar","type":"conjugate","prompt":"If the client ___ (to provide) the documents on time, we will finish on Friday.","answers":["provides"],"explanation":"Condition réelle : if + présent simple, will + base verbale. N'oubliez pas le -s de la troisième personne."},{"id":"grm-010","theme":"grammar","type":"conjugate","prompt":"If we ___ (to have) more staff, we would close the books faster.","answers":["had"],"explanation":"Hypothèse irréelle dans le présent : if + prétérit, would + base verbale."},{"id":"grm-011","theme":"grammar","type":"conjugate","prompt":"Every year, the financial statements ___ (to prepare, passif) in accordance with IFRS.","answers":["are prepared"],"explanation":"Fait habituel au passif : are + participe passé. « In accordance with » = conformément à.","term":"in accordance with","fr":"conformément à"},{"id":"grm-012","theme":"grammar","type":"conjugate","prompt":"The discrepancy ___ (to discover, passif) during last year's audit.","answers":["was discovered"],"explanation":"Passif au past simple : was + participe passé. « Discrepancy » = écart, incohérence.","term":"a discrepancy","fr":"un écart, une incohérence"},{"id":"grm-013","theme":"grammar","type":"conjugate","prompt":"The report ___ (to issue, passif) next Monday.","answers":["will be issued"],"explanation":"Futur passif : will be + participe passé."},{"id":"grm-014","theme":"grammar","type":"conjugate","prompt":"Three control deficiencies ___ (to report, passif) to management since the start of the audit.","answers":["have been reported"],"explanation":"« Since » appelle le present perfect ; au passif : have been + participe passé."},{"id":"grm-015","theme":"grammar","type":"conjugate","prompt":"It would be helpful if you ___ (can) confirm the balances by Thursday.","answers":["could"],"explanation":"Après « It would be helpful if… », on emploie « could » : demande polie et indirecte."},{"id":"grm-016","theme":"grammar","type":"conjugate","prompt":"By this time next week, we ___ (to finish) the fieldwork.","answers":["will have finished"],"explanation":"Action qui sera accomplie avant un moment futur : futur antérieur (will have + participe passé)."},{"id":"grm-017","theme":"grammar","type":"fill","prompt":"The report is due ___ Monday.","hint":"préposition (devant un jour)","answers":["on"],"explanation":"« On » devant un jour ou une date : on Monday, on 15 March."},{"id":"grm-018","theme":"grammar","type":"fill","prompt":"The audit will start ___ March.","hint":"préposition (devant un mois)","answers":["in"],"explanation":"« In » devant un mois, une année, une saison : in March, in 2025."},{"id":"grm-019","theme":"grammar","type":"fill","prompt":"The call is ___ 3 p.m. Paris time.","hint":"préposition (devant une heure)","answers":["at"],"explanation":"« At » devant une heure : at 3 p.m., at noon."},{"id":"grm-020","theme":"grammar","type":"fill","prompt":"We closed the books two weeks ___.","hint":"il y a (se place après la durée)","answers":["ago"],"explanation":"« Two weeks ago » = il y a deux semaines. « Ago » suit la durée et impose le past simple.","term":"two weeks ago","fr":"il y a deux semaines"},{"id":"grm-021","theme":"grammar","type":"fill","prompt":"The fieldwork lasted ___ three weeks.","hint":"pendant (+ durée)","answers":["for"],"explanation":"« For » + durée (for three weeks). « During » s'emploie devant le nom d'une période ou d'un événement : during the audit."},{"id":"grm-022","theme":"grammar","type":"fill","prompt":"No issues were raised ___ the audit committee meeting.","hint":"pendant (+ événement)","answers":["during","at","in"],"explanation":"« During » + événement : during the meeting. Jamais « during » + durée chiffrée."},{"id":"grm-023","theme":"grammar","type":"fill","prompt":"___ you send me the file by noon, please?","hint":"forme polie de « can »","answers":["Could","Would"],"explanation":"« Could you…? » est plus poli que « Can you…? ». C'est la forme standard d'une demande professionnelle."},{"id":"grm-024","theme":"grammar","type":"fill","prompt":"___ it be possible to move the meeting to Thursday?","hint":"auxiliaire du conditionnel","answers":["Would"],"explanation":"« Would it be possible to…? » : demande très polie, utile avec un client ou un supérieur.","term":"Would it be possible to…?","fr":"Serait-il possible de… ?"},{"id":"grm-025","theme":"grammar","type":"fill","prompt":"Sales ___ rise next year, but it is far from certain.","hint":"pourraient (possibilité incertaine)","answers":["might","may","could"],"explanation":"« Might » / « may » / « could » expriment une possibilité. « Might » est le plus incertain."},{"id":"grm-026","theme":"grammar","type":"fill","prompt":"Margins ___ improve in the second half, given the price increases already signed.","hint":"devraient (prévision probable)","answers":["should","ought to"],"explanation":"« Should » exprime ici une prévision probable : les marges devraient s'améliorer."},{"id":"grm-027","theme":"grammar","type":"fill","prompt":"The provision ___ be recognised: the obligation is certain and the amount can be estimated.","hint":"doit (obligation)","answers":["must","should","has to","needs to"],"explanation":"« Must » + base verbale exprime l'obligation. Ici au passif : must be recognised.","note":"GB : recognised · US : recognized"},{"id":"grm-028","theme":"grammar","type":"fill","prompt":"I'll send you the draft ___ the end of the week.","hint":"d'ici (échéance)","answers":["by","before"],"explanation":"« By the end of the week » = d'ici la fin de la semaine, au plus tard.","term":"by the end of the week","fr":"d'ici la fin de la semaine"},{"id":"grm-029","theme":"grammar","type":"fill","prompt":"We have not finished the testing ___.","hint":"encore (en fin de phrase négative)","answers":["yet"],"explanation":"« Not… yet » = pas encore. « Yet » se place en fin de phrase, avec le present perfect."},{"id":"grm-030","theme":"grammar","type":"fill","prompt":"The entity has ___ adopted the new standard; it did so last year.","hint":"déjà","answers":["already"],"explanation":"« Already » se place entre « have » et le participe passé."},{"id":"grm-031","theme":"grammar","type":"fill","prompt":"We will stay on site ___ Friday, then return to the office.","hint":"jusqu'à","answers":["until","till"],"explanation":"« Until » = jusqu'à (durée). À ne pas confondre avec « by » (au plus tard)."},{"id":"grm-032","theme":"grammar","type":"fill","bank":true,"prompt":"The accounts ___ by the board last Tuesday.","answers":["were approved"],"distractors":["have been approved","are approved","was approved"],"explanation":"« Last Tuesday » impose le past simple ; le sujet est pluriel (accounts) : were approved."},{"id":"grm-033","theme":"grammar","type":"fill","bank":true,"prompt":"We ___ the client's premises three times so far this year.","answers":["have visited"],"distractors":["visited","are visiting","had visit"],"explanation":"« So far this year » : la période n'est pas terminée, donc present perfect."},{"id":"grm-034","theme":"grammar","type":"fill","bank":true,"prompt":"If I ___ you, I would double-check the cut-off.","answers":["were"],"distractors":["am","would be","will be"],"explanation":"« If I were you, I would… » = à votre place, je… : formule courante pour donner un conseil."},{"id":"grm-035","theme":"grammar","type":"fill","bank":true,"prompt":"You ___ submit the report before the deadline: it is mandatory.","answers":["must"],"distractors":["might","would","can to"],"explanation":"« Must » = obligation. Les modaux sont suivis de la base verbale, sans « to »."},{"id":"grm-036","theme":"grammar","type":"translate","direction":"fr-en","prompt":"Pourriez-vous m'envoyer le fichier ?","answers":["Could you send me the file?","Could you please send me the file?","Could you send me the file, please?","Would you send me the file?","Could you send the file to me?","Can you send me the file?","Would you mind sending me the file?"],"explanation":"« Could you send me the file? » : le conditionnel français correspond à « could »."},{"id":"grm-037","theme":"grammar","type":"translate","direction":"fr-en","prompt":"Serait-il possible de reporter la réunion ?","answers":["Would it be possible to postpone the meeting?","Would it be possible to reschedule the meeting?","Would it be possible to put off the meeting?","Would it be possible to push back the meeting?","Would it be possible to move the meeting?"],"explanation":"« Would it be possible to » + base verbale."},{"id":"grm-038","theme":"grammar","type":"translate","direction":"fr-en","prompt":"Le rapport a été envoyé hier.","answers":["The report was sent yesterday."],"reject":["The report has been sent yesterday."],"explanation":"Passé composé français + « hier » = past simple en anglais : was sent. Le present perfect est impossible avec « yesterday »."},{"id":"grm-039","theme":"grammar","type":"translate","direction":"fr-en","prompt":"Les ventes devraient augmenter l'année prochaine.","answers":["Sales should increase next year.","Sales should rise next year.","Sales should grow next year.","Sales should go up next year.","Sales are expected to increase next year.","Sales are expected to rise next year.","Sales are expected to grow next year.","Sales are likely to increase next year.","Sales are likely to rise next year.","Sales are likely to grow next year."],"explanation":"« Should » ou « are expected to » pour une prévision probable."},{"id":"grm-040","theme":"grammar","type":"translate","direction":"fr-en","prompt":"Je travaille ici depuis 2022.","answers":["I have worked here since 2022.","I have been working here since 2022."],"reject":["I work here since 2022.","I am working here since 2022."],"explanation":"Présent français + « depuis » = present perfect anglais."},{"id":"grm-041","theme":"grammar","type":"translate","direction":"fr-en","prompt":"Nous n'avons pas encore reçu la facture.","answers":["We have not received the invoice yet.","We have not yet received the invoice.","We still have not received the invoice.","We did not receive the invoice yet."],"explanation":"« Not… yet » + present perfect : We haven't received the invoice yet.","note":"L'emploi du prétérit avec « yet » (We didn't receive it yet) est courant en anglais américain."},{"id":"grm-042","theme":"grammar","type":"translate","direction":"fr-en","prompt":"il y a deux semaines","answers":["two weeks ago","2 weeks ago","a fortnight ago"],"explanation":"Durée + « ago ». « A fortnight » (GB) = quinze jours."},{"id":"grm-043","theme":"grammar","type":"translate","direction":"en-fr","prompt":"The report is being reviewed.","answers":["Le rapport est en cours de revue."],"distractors":["Le rapport a été revu.","Le rapport sera revu.","Le rapport doit être revu."],"explanation":"Présent continu passif (is being + participe passé) : l'action est en cours."},{"id":"grm-044","theme":"grammar","type":"translate","direction":"en-fr","prompt":"We should have booked the accrual.","answers":["Nous aurions dû comptabiliser la charge à payer."],"distractors":["Nous devrions comptabiliser la charge à payer.","Nous avons dû comptabiliser la charge à payer.","Nous devons comptabiliser la charge à payer."],"explanation":"« Should have » + participe passé = aurait dû : un re       storage = { getItem: function (k) { return k in mem ? mem[k] : null; }, setItem: function (k, v) { mem[k] = String(v); }, removeItem: function (k) { delete mem[k]; } };
    }
    sync.client = EP.syncCore.createClient({ fetch: function (u, o) { return window.fetch(u, o); }, storage: storage });
  }

  function scheduleSync(delay) {
    if (!sync.isConnected() || !sync.available()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { runSync(false); }, delay == null ? 4000 : delay);
  }

  /** Fusionne la progression en ligne avec celle de l'appareil. manual : déclenché par l'utilisateur. */
  function runSync(manual) {
    if (!sync.isConnected()) return Promise.resolve(null);
    if (!sync.available()) { if (manual) UI.toast(EP.syncCore.MESSAGES.blocked); return Promise.resolve(null); }
    // pendant un exercice, on ne touche pas à la progression : on synchronisera à la sortie
    if (sync.running || app.sub === 'session' || app.sub === 'flash') { sync.pending = true; return Promise.resolve(null); }
    sync.running = true;
    sync.pending = false;
    if (manual) UI.toast('Synchronisation…', 1500);
    return sync.client.sync(app.state,
      function (l, r) { return MG.mergeStates(l, r, today()); },
      function (s) { return ST.exportState(s, now()); },
      function (t) { return ST.importState(t, now()); }
    ).then(function (res) {
      sync.running = false;
      sync.error = null;
      if (app.sub === 'session' || app.sub === 'flash') { sync.pending = true; return res; }   // un exercice a commencé entre-temps
      var before = MG.fingerprint(app.state);
      Object.keys(res.state).forEach(function (k) { app.state[k] = res.state[k]; });   // remplacement sur place
      app.store.save(app.state);
      if (MG.fingerprint(app.state) !== before) {
        rebuildItems();
        if (!app.sub && (app.tab !== 'mots' || manual)) render();
      } else if (!app.sub && app.tab === 'reglages') render();
      if (manual) UI.toast('Progression synchronisée.');
      return res;
    }, function (err) {
      sync.running = false;
      sync.error = err;
      if (err.code === 'offline' || err.code === 'network') sync.pending = true;
      if (manual) UI.modal({ title: 'Synchronisation impossible', body: err.message });
      else if (!app.sub && (err.code === 'auth' || err.code === 'scope')) render();
      return null;
    });
  }

  function syncIfStale() {
    var c = sync.client && sync.client.config;
    if (sync.isConnected() && (sync.pending || !c.lastSync || Date.now() - c.lastSync > 60000)) runSync(false);
  }

  /* ====================== Contenu ====================== */

  function fetchJSON(url, isRetry) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(url + ' : ' + r.status);
      return r.json();
    }).catch(function (err) {
      if (isRetry) throw err;
      // un second essai après une courte pause (réseau instable, cache en cours d'écriture)
      return new Promise(function (resolve) { setTimeout(resolve, 500); }).then(function () { return fetchJSON(url, true); });
    });
  }

  function loadContent() {
    if (window.EP_CONTENT) return Promise.resolve(window.EP_CONTENT);
    return fetchJSON('content/index.json').then(function (index) {
      return Promise.all((index.files || []).map(function (file) {
        return fetchJSON('content/' + file).catch(function (err) {
          console.warn('[English Pro] Thème illisible :', file, err);
          app.contentErrors.push(file);
          return null;
        });
      }));
    });
  }

  function installContent(files) {
    var seen = {};
    app.themes = [];
    (files || []).forEach(function (t) {
      if (!t || !t.id || !Array.isArray(t.items)) return;
      var theme = { id: t.id, title: t.title || t.id, icon: t.icon || '📘', description: t.description || '', items: [] };
      t.items.forEach(function (it) {
        if (it && !it.theme) it.theme = t.id;
        var errors = C.validateItem(it);
        if (it && seen[it.id]) errors.push('id en double');
        if (errors.length) { console.warn('[English Pro] Item ignoré', it && it.id, errors); return; }
        seen[it.id] = 1;
        theme.items.push(it);
      });
      app.themes.push(theme);
    });
    rebuildItems();
  }

  function rebuildItems() {
    app.items = [];
    app.byId = {};
    function add(it) { app.items.push(it); app.byId[it.id] = it; }
    app.themes.forEach(function (t) { t.items.forEach(add); });
    var known = {};
    app.themes.forEach(function (t) { known[t.id] = 1; });
    app.state.custom.forEach(function (w) {
      var it = C.customToItem(w);
      if (!known[it.theme]) it.theme = CUSTOM_THEME.id;
      add(it);
    });
  }

  function audioOK() { return TTS.status().available && app.state.settings.listening; }

  function availableItems() {
    if (audioOK()) return app.items;

  }

  function themeList() {
    var list = app.themes.slice();
    if (app.items.some(function (it) { return it.theme === CUSTOM_THEME.id; })) list.push(CUSTOM_THEME);

  }

  function themeStats(themeId, items) {
    var cards = app.state.cards, total = 0, learned = 0, sum = 0, fresh = 0;
    (items || availableItems()).forEach(function (it) {
      if (it.theme !== themeId) return;
      total++;
      var c = cards[it.id];
      sum += SRS.mastery(c);
      if (SRS.isLearned(c)) learned++;
      if (SRS.isNew(c)) fresh++;
    });
    return { total: total, learned: learned, fresh: fresh, mastery: total ? Math.round(100 * sum / total) : 0 };

  function openSub(name) {
    app.sub = name;
    // Une entrée d'historique par sous-écran : le geste « retour » du téléphone ferme la session, pas l'application.
    if (useHistory && !inSubState()) { try { history.pushState({ ep: 'sub' }, ''); } catch (e) { /* rien */ } }

  function closeSub() {
    TTS.stop();
    app.sub = null; app.session = null; app.flash = null;
    if (useHistory && inSubState()) { try { history.back(); } catch (e) { /* rien */ } }
    render();
    if (sync.pending) scheduleSync(500);
