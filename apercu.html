e début de l'année.","answers":["Headcount has increased since the beginning of the year.","Since the beginning of the year headcount has increased."],"explanation":"« Since » + point de départ : present perfect (has increased)."},{"id":"cdg-045","theme":"controlling","type":"match","pairs":[["actuals","le réel"],["forecast","prévision"],["variance","écart"],["headcount","effectifs"]],"explanation":"Le quatuor de base du contrôleur de gestion : actuals, forecast, variance, headcount."},{"id":"cdg-046","theme":"controlling","type":"match","pairs":[["P&L","compte de résultat"],["cost centre","centre de coûts"],["overheads","frais généraux"],["YTD","cumul annuel à ce jour"]],"explanation":"« P&L » = profit and loss ; « YTD » = year to date."},{"id":"cdg-047","theme":"controlling","type":"error","prompt":"The [benefit] of the subsidiary increased by 10% this year.","answers":["The profit of the subsidiary increased by 10% this year."],"explanation":"Faux ami : « benefit » = avantage (ou prestation sociale). Le bénéfice comptable = « profit ». « Subsidiary » = filiale."},{"id":"cdg-048","theme":"controlling","type":"error","prompt":"We have [actualized] the forecast for the second half.","answers":["We have updated the forecast for the second half."],"explanation":"Actualiser = « to update ». « Second half » (H2) = second semestre."},{"id":"cdg-049","theme":"controlling","type":"error","prompt":"Sales are 5% [upper] than budget this quarter.","answers":["Sales are 5% higher than budget this quarter."],"explanation":"Le comparatif de « high » est « higher ». « Upper » signifie « du haut » (the upper limit) et ne s'emploie pas avec « than »."},{"id":"cdg-050","theme":"controlling","type":"error","prompt":"This variance is explained [with] a one-off bonus payment.","answers":["This variance is explained by a one-off bonus payment."],"explanation":"« Explained by » : l'agent du passif est introduit par « by ». « One-off » = exceptionnel, non récurrent."},{"id":"cdg-051","theme":"controlling","type":"dictation","answers":["The variance is mainly due to higher raw material costs."],"explanation":"« Raw material costs » = coûts des matières premières. Phrase type d'un commentaire d'écart."},{"id":"cdg-052","theme":"controlling","type":"dictation","answers":["We are slightly behind budget this month."],"explanation":"« Behind budget » = en retard sur le budget ; « ahead of budget » = en avance. « Slightly » = légèrement."},{"id":"cdg-053","theme":"controlling","type":"dictation","answers":["Could you send me the latest forecast?"],"explanation":"« The latest forecast » = la prévision la plus récente."},{"id":"cdg-054","theme":"controlling","type":"listen","audio":"Operating expenses came in two percent under budget.","prompt":"Que faut-il comprendre ?","answers":["Les charges d'exploitation sont inférieures de 2 % au budget."],"distractors":["Les charges d'exploitation dépassent le budget de 2 %.","Les charges d'exploitation ont baissé de 2 % par rapport à l'an dernier.","Le budget des charges a été réduit de 2 %."],"explanation":"« Under budget » = en dessous du budget, ce qui est favorable pour des charges."},{"id":"cdg-055","theme":"controlling","type":"listen","audio":"We'll have to reforecast after the half-year results.","prompt":"Que dit la personne ?","answers":["Il faudra refaire la prévision après les résultats semestriels."],"distractors":["Il faudra refaire le budget avant les résultats semestriels.","Les résultats semestriels sont conformes à la prévision.","La prévision ne sera pas modifiée cette année."],"explanation":"« To reforecast » = refaire la prévision. « Half-year results » = résultats semestriels.","term":"to reforecast","fr":"refaire la prévision"}]},{"id":"audit","title":"Audit financier","icon":"🔎","description":"Mission d'audit, commissaire aux comptes, seuil de signification, sondages, contrôles de substance, contrôle interne, éléments probants, IFRS, provisions, dépréciations, continuité d'exploitation.","items":[{"id":"aud-001","theme":"audit","type":"fill","prompt":"This is my first audit ___ as a junior in the firm.","hint":"mission","answers":["engagement","assignment"],"explanation":"« An audit engagement » = une mission d'audit. « The firm » = le cabinet ; « a junior » = un auditeur débutant.","term":"an audit engagement","fr":"une mission d'audit"},{"id":"aud-002","theme":"audit","type":"fill","prompt":"The statutory ___ signs the audit report on the financial statements.","hint":"commissaire aux comptes : statutory ___","answers":["auditor"],"explanation":"« Statutory auditor » = commissaire aux comptes (CAC) : l'auditeur légal. « Statutory audit » = audit légal.","term":"the statutory auditor","fr":"le commissaire aux comptes (CAC)"},{"id":"aud-003","theme":"audit","type":"fill","prompt":"Any misstatement above ___ must be reported to the audit partner.","hint":"seuil de signification","answers":["materiality","the materiality threshold","the materiality level"],"explanation":"« Materiality » = seuil de signification. Une anomalie qui le dépasse est « material » (significative).","term":"materiality","fr":"seuil de signification"},{"id":"aud-004","theme":"audit","type":"fill","prompt":"We selected a ___ of 25 invoices for testing.","hint":"échantillon","answers":["sample"],"explanation":"« A sample » = un échantillon. « Sampling » = la technique du sondage.","term":"a sample","fr":"un échantillon"},{"id":"aud-005","theme":"audit","type":"fill","prompt":"We performed a ___ to understand the purchase-to-pay process from start to finish.","hint":"test de cheminement","answers":["walkthrough","walk-through","walkthrough test"],"explanation":"« A walkthrough » = un test de cheminement : on suit une opération d'un bout à l'autre du processus pour comprendre les contrôles.","term":"a walkthrough","fr":"un test de cheminement"},{"id":"aud-006","theme":"audit","type":"fill","prompt":"The client has not booked an ___ for the December electricity bill.","hint":"charge à payer","answers":["accrual","accrued expense"],"explanation":"« An accrual » = une charge à payer : charge de l'exercice dont la facture n'est pas encore reçue. « To book » = comptabiliser.","term":"an accrual","fr":"une charge à payer"},{"id":"aud-007","theme":"audit","type":"fill","prompt":"Management must assess whether the going ___ assumption is appropriate.","hint":"continuité d'exploitation : going ___","answers":["concern"],"explanation":"« Going concern » = continuité d'exploitation : l'entité est présumée poursuivre son activité dans un avenir prévisible.","term":"going concern","fr":"continuité d'exploitation"},{"id":"aud-008","theme":"audit","type":"fill","prompt":"An ___ loss was recognised on the goodwill.","hint":"dépréciation (perte de valeur)","answers":["impairment"],"explanation":"« Impairment » = dépréciation, perte de valeur (IAS 36). Ne pas confondre avec « depreciation », qui est l'amortissement.","note":"GB : recognised · US : recognized","term":"an impairment loss","fr":"une perte de valeur, une dépréciation"},{"id":"aud-009","theme":"audit","type":"fill","prompt":"We need sufficient and appropriate audit ___ to support our opinion.","hint":"éléments probants","answers":["evidence"],"explanation":"« Audit evidence » = éléments probants. « Evidence » est indénombrable : jamais de -s, jamais « an evidence ».","term":"audit evidence","fr":"éléments probants"},{"id":"aud-010","theme":"audit","type":"fill","prompt":"Our ___ will be summarised in the management letter.","hint":"constats","answers":["findings","observations"],"explanation":"« Findings » = constats d'audit. Ils sont repris dans la « management letter » (lettre de recommandations).","term":"findings","fr":"constats"},{"id":"aud-011","theme":"audit","type":"fill","prompt":"The engagement ___ sets out the scope and fees of the audit.","hint":"lettre","answers":["letter"],"explanation":"« Engagement letter » = lettre de mission. « Scope » = périmètre ; « fees » = honoraires.","term":"the engagement letter","fr":"la lettre de mission"},{"id":"aud-012","theme":"audit","type":"fill","prompt":"We attended the year-end inventory ___ at the warehouse.","hint":"comptage, inventaire physique","answers":["count","counting","stocktake"],"explanation":"« Inventory count » = inventaire physique. L'auditeur y assiste (to attend) pour vérifier l'existence des stocks.","note":"GB : stocktake, stock count · US : physical inventory count","term":"an inventory count","fr":"un inventaire physique"},{"id":"aud-013","theme":"audit","type":"fill","prompt":"Could you provide the bank ___ for all accounts as at 31 December?","hint":"rapprochements","answers":["reconciliations","reconciliation","recs"],"explanation":"« Bank reconciliation » = rapprochement bancaire. « As at 31 December » = au 31 décembre.","note":"GB : as at 31 December · US : as of December 31","term":"a bank reconciliation","fr":"un rapprochement bancaire"},{"id":"aud-014","theme":"audit","type":"fill","prompt":"Weak segregation of ___ increases the risk of fraud.","hint":"séparation des tâches : segregation of ___","answers":["duties"],"explanation":"« Segregation of duties » = séparation des tâches, principe de base du contrôle interne.","term":"segregation of duties","fr":"séparation des tâches"},{"id":"aud-015","theme":"audit","type":"fill","prompt":"We test ___ to check that transactions are recorded in the correct period.","hint":"séparation des exercices (cut-…)","answers":["cut-off","cutoff"],"explanation":"« Cut-off » = séparation des exercices : rattacher charges et produits à la bonne période.","term":"cut-off","fr":"séparation des exercices"},{"id":"aud-016","theme":"audit","type":"fill","prompt":"The analytical ___ showed an unexpected increase in the gross margin.","hint":"revue","answers":["review","procedures"],"explanation":"« Analytical review » ou « analytical procedures » = revue analytique : on compare les chiffres à l'exercice précédent, au budget et à ses attentes.","term":"analytical review","fr":"revue analytique"},{"id":"aud-017","theme":"audit","type":"fill","bank":true,"prompt":"The auditor's opinion is ___: the financial statements give a true and fair view.","answers":["unqualified"],"distractors":["qualified","adverse","disclaimed"],"explanation":"« Unqualified opinion » = opinion sans réserve. Piège : « qualified opinion » = opinion AVEC réserve. « True and fair view » = image fidèle."},{"id":"aud-018","theme":"audit","type":"fill","bank":true,"prompt":"___ testing provides direct evidence on account balances.","answers":["Substantive"],"distractors":["Substantial","Substance","Subsequent"],"explanation":"« Substantive testing » = contrôles de substance (tests de détail et procédures analytiques), par opposition aux « tests of controls »."},{"id":"aud-019","theme":"audit","type":"fill","bank":true,"prompt":"Depreciation is charged on a straight-___ basis over five years.","answers":["line"],"distractors":["way","time","rate"],"explanation":"« Straight-line depreciation » = amortissement linéaire. Le dégressif se dit « declining balance » ou « reducing balance »."},{"id":"aud-020","theme":"audit","type":"conjugate","prompt":"The audit team ___ (to complete) the interim work in October last year.","answers":["completed"],"explanation":"Date précise dans le passé : past simple. « Interim work » = la phase d'intérim."},{"id":"aud-021","theme":"audit","type":"conjugate","prompt":"The inventory ___ (to count, passif) on 31 December in the presence of the auditors.","answers":["was counted"],"explanation":"Passif au past simple : was + participe passé. Le passif est très fréquent dans les rapports d'audit."},{"id":"aud-022","theme":"audit","type":"conjugate","prompt":"No material misstatements ___ (to identify, passif) so far.","answers":["have been identified"],"explanation":"« So far » appelle le present perfect ; au passif : have been + participe passé."},{"id":"aud-023","theme":"audit","type":"conjugate","prompt":"The provision ___ (to reverse, passif) next year if the dispute is settled.","answers":["will be reversed"],"explanation":"Futur passif : will be + participe passé. « To reverse a provision » = reprendre une provision."},{"id":"aud-024","theme":"audit","type":"conjugate","prompt":"The key controls ___ (to test, passif) by the team at the moment.","answers":["are being tested"],"explanation":"Action en cours au passif : are being + participe passé."},{"id":"aud-025","theme":"audit","type":"translate","direction":"fr-en","prompt":"le contrôle interne","answers":["internal control","internal controls"],"explanation":"« Internal control » = le dispositif de contrôle interne ; « internal controls » = les contrôles eux-mêmes.","term":"internal control","fr":"contrôle interne"},{"id":"aud-026","theme":"audit","type":"translate","direction":"fr-en","prompt":"une anomalie significative","answers":["a material misstatement"],"explanation":"« A material misstatement » = une anomalie significative : erreur ou fraude dépassant le seuil de signification.","term":"a material misstatement","fr":"une anomalie significative"},{"id":"aud-027","theme":"audit","type":"translate","direction":"fr-en","prompt":"les états financiers","answers":["the financial statements"],"explanation":"« Financial statements » = états financiers. On dit aussi « the accounts » au Royaume-Uni.","term":"the financial statements","fr":"les états financiers"},{"id":"aud-028","theme":"audit","type":"translate","direction":"fr-en","prompt":"une créance client","answers":["a trade receivable","a receivable","an account receivable","a customer receivable","a trade debtor"],"explanation":"« Trade receivables » = créances clients ; « trade payables » = dettes fournisseurs.","note":"GB (usage ancien) : debtors / creditors · US : accounts receivable / accounts payable","term":"a trade receivable","fr":"une créance client"},{"id":"aud-029","theme":"audit","type":"translate","direction":"fr-en","prompt":"la lettre d'affirmation","answers":["the representation letter","the letter of representation","the management representation letter"],"explanation":"« Representation letter » = lettre d'affirmation, signée par la direction. Ne pas confondre avec la « management letter » (lettre de recommandations).","term":"the representation letter","fr":"la lettre d'affirmation"},{"id":"aud-030","theme":"audit","type":"translate","direction":"fr-en","prompt":"les pièces justificatives","answers":["supporting documents","the supporting documents","supporting documentation","supporting evidence"],"explanation":"« Supporting documents » = pièces justificatives (factures, contrats, relevés).","term":"supporting documents","fr":"pièces justificatives"},{"id":"aud-031","theme":"audit","type":"translate","direction":"fr-en","prompt":"une écriture comptable","answers":["a journal entry","an accounting entry","an entry","a booking"],"explanation":"« A journal entry » = une écriture comptable. « To post / book an entry » = passer une écriture.","term":"a journal entry","fr":"une écriture comptable"},{"id":"aud-032","theme":"audit","type":"translate","direction":"en-fr","prompt":"going concern","answers":["continuité d'exploitation","continuité de l'exploitation"],"explanation":"« Going concern » = continuité d'exploitation. « A going concern issue » = un risque sur la continuité d'exploitation."},{"id":"aud-033","theme":"audit","type":"translate","direction":"en-fr","prompt":"the management letter","answers":["la lettre de recommandations","la lettre de recommandation"],"explanation":"« Management letter » = lettre de recommandations : les faiblesses de contrôle interne relevées et les recommandations de l'auditeur.","term":"the management letter","fr":"la lettre de recommandations"},{"id":"aud-034","theme":"audit","type":"translate","direction":"en-fr","prompt":"substantive testing","answers":["les contrôles de substance","les tests de substance","les procédures de substance","le contrôle de substance"],"explanation":"« Substantive testing » = contrôles de substance : ils portent directement sur les soldes et les opérations.","term":"substantive testing","fr":"contrôles de substance"},{"id":"aud-035","theme":"audit","type":"translate","direction":"en-fr","prompt":"a trial balance","answers":["une balance générale","une balance","une balance des comptes","une balance comptable"],"explanation":"« Trial balance » (TB) = balance générale. « General ledger » (GL) = grand livre.","term":"a trial balance","fr":"une balance générale"},{"id":"aud-036","theme":"audit","type":"mcq","choices":"fr","prompt":"À quoi correspond « depreciation » en français ?","answers":["L'amortissement d'une immobilisation corporelle"],"distractors":["La dépréciation d'une créance","La provision pour risques","La perte de change"],"explanation":"Piège classique : « depreciation » = amortissement. La dépréciation (perte de valeur) se dit « impairment ».","term":"depreciation","fr":"amortissement (immobilisations corporelles)"},{"id":"aud-037","theme":"audit","type":"mcq","choices":"fr","prompt":"En IFRS, quelle est la différence entre « accrual » et « provision » ?","answers":["Un accrual est une charge dont le montant et l'échéance sont quasi certains ; une provision est un passif dont le montant ou l'échéance est incertain."],"distractors":["Un accrual concerne les produits ; une provision concerne les charges.","Un accrual figure au bilan ; une provision uniquement en annexe.","Aucune : les deux termes sont interchangeables."],"explanation":"IAS 37 : une provision est un passif dont l'échéance ou le montant est incertain. Les « accruals » (charges à payer) comportent beaucoup moins d'incertitude.","term":"a provision","fr":"une provision (passif incertain)"},{"id":"aud-038","theme":"audit","type":"mcq","choices":"fr","prompt":"Que signifie « PBC list » dans une mission d'audit ?","answers":["La liste des documents à préparer par le client (prepared by client)"],"distractors":["La liste des contrôles clés de la période (period-based controls)","Le budget prévisionnel de la mission (planned budget costs)","La liste des écritures passées par le cabinet (posted by consultant)"],"explanation":"« PBC » = prepared by client. La « PBC list » (ou « request list ») recense les documents demandés au client.","term":"the PBC list","fr":"la liste des documents demandés au client"},{"id":"aud-039","theme":"audit","type":"mcq","prompt":"Vous demandez un justificatif à un comptable du client. Quelle formulation choisir ?","answers":["Could you please provide the supporting documents for this entry?"],"distractors":["Give me the proofs of this writing.","You must justify this entry now.","I want the papers of this accounting."],"explanation":"« Supporting documents » = pièces justificatives ; « entry » = écriture. « Could you please… » garde un ton courtois avec le client."},{"id":"aud-040","theme":"audit","type":"mcq","choices":"fr","prompt":"Que vérifie l'assertion « completeness » ?","answers":["Que toutes les opérations qui devaient être enregistrées l'ont été"],"distractors":["Que les opérations enregistrées ont réellement eu lieu","Que les montants sont correctement calculés","Que les opérations sont rattachées à la bonne période"],"explanation":"« Completeness » = exhaustivité. Les autres réponses décrivent « occurrence » (réalité), « accuracy » (exactitude) et « cut-off » (séparation des exercices).","term":"completeness","fr":"exhaustivité"},{"id":"aud-041","theme":"audit","type":"mcq","prompt":"IFRS stands for International Financial Reporting ___.","answers":["Standards"],"distractors":["Statements","Systems","Schedules"],"explanation":"IFRS = International Financial Reporting Standards, les normes comptables internationales publiées par l'IASB."},{"id":"aud-042","theme":"audit","type":"mcq","choices":"fr","prompt":"Que signifie « to sign off the accounts » ?","answers":["Valider formellement les comptes"],"distractors":["Résilier la mission d'audit","Clôturer un compte bancaire","Refuser de certifier les comptes"],"explanation":"« To sign off » = valider, donner son approbation finale. « The partner signed off the file » = l'associé a validé le dossier.","term":"to sign off","fr":"valider, approuver formellement"},{"id":"aud-043","theme":"audit","type":"mcq","choices":"fr","prompt":"Que désigne « fieldwork » ?","answers":["Les travaux d'audit réalisés chez le client"],"distractors":["Les travaux de saisie comptable","La formation des nouveaux auditeurs","L'inventaire des terrains de l'entreprise"],"explanation":"« Fieldwork » = l'intervention sur site, chez le client. « We start fieldwork on Monday. »","term":"fieldwork","fr":"intervention sur site (chez le client)"},{"id":"aud-044","theme":"audit","type":"mcq","choices":"fr","prompt":"Qu'est-ce qu'une « qualified opinion » ?","answers":["Une opinion avec réserve"],"distractors":["Une opinion sans réserve","Une opinion rendue par un auditeur diplômé","Un refus de certifier"],"explanation":"« Qualified » signifie ici « assortie d'une réserve ». Sans réserve = « unqualified » ; refus de certifier = « adverse opinion » ; impossibilité de certifier = « disclaimer of opinion ».","term":"a qualified opinion","fr":"une opinion avec réserve"},{"id":"aud-045","theme":"audit","type":"order","prompt":"Il nous faut les pièces justificatives de ces trois factures.","answers":["We need supporting documents for these three invoices."],"explanation":"« Supporting documents for » + ce qui est justifié."},{"id":"aud-046","theme":"audit","type":"order","prompt":"L'équipe d'audit sera sur site la semaine prochaine.","answers":["The audit team will be on site next week.","Next week the audit team will be on site."],"explanation":"« On site » = sur site, chez le client."},{"id":"aud-047","theme":"audit","type":"order","prompt":"Aucune anomalie n'a été relevée lors de nos tests.","answers":["No exceptions were noted during our testing.","During our testing no exceptions were noted."],"explanation":"« No exceptions were noted » : formule standard de conclusion d'un test. « Exception » = anomalie relevée sur un élément testé."},{"id":"aud-048","theme":"audit","type":"order","prompt":"Pourriez-vous m'expliquer pas à pas le processus de vente ?","answers":["Could you walk me through the sales process?"],"explanation":"« To walk someone through something » = expliquer pas à pas. Très utile lors des entretiens de prise de connaissance."},{"id":"aud-049","theme":"audit","type":"order","prompt":"La provision a été reprise à la clôture.","answers":["The provision was reversed at year end.","At year end the provision was reversed."],"explanation":"« To reverse a provision » = reprendre une provision. « At year end » = à la clôture de l'exercice."},{"id":"aud-050","theme":"audit","type":"order","prompt":"La confirmation bancaire a-t-elle déjà été reçue ?","answers":["Has the bank confirmation been received yet?","Has the bank confirmation yet been received?"],"explanation":"Present perfect passif dans une question : Has + sujet + been + participe passé. « Yet » se place en fin de phrase."},{"id":"aud-051","theme":"audit","type":"match","pairs":[["materiality","seuil de signification"],["sampling","sondage"],["findings","constats"],["audit evidence","éléments probants"]],"explanation":"Quatre notions centrales de la démarche d'audit."},{"id":"aud-052","theme":"audit","type":"match","pairs":[["accrual","charge à payer"],["impairment","dépréciation"],["depreciation","amortissement"],["going concern","continuité d'exploitation"]],"explanation":"Attention au couple piège : « impairment » = dépréciation ; « depreciation » = amortissement."},{"id":"aud-053","theme":"audit","type":"match","pairs":[["receivables","créances"],["payables","dettes fournisseurs"],["inventory","stocks"],["fixed assets","immobilisations"]],"explanation":"Les grands postes du bilan.","note":"GB : stock, debtors, creditors (usage traditionnel) · US : inventory, receivables, payables"},{"id":"aud-054","theme":"audit","type":"error","prompt":"The auditors [controlled] a sample of sixty invoices.","answers":["The auditors tested a sample of sixty invoices."],"explanation":"Faux ami : « to control » = maîtriser, diriger. Vérifier = « to check » ou « to test »."},{"id":"aud-055","theme":"audit","type":"error","prompt":"The goodwill [depreciation] of 2 million euros reflects the loss of a major client.","answers":["The goodwill impairment of 2 million euros reflects the loss of a major client."],"explanation":"Le goodwill n'est pas amorti en IFRS : il fait l'objet d'un test de dépréciation (« impairment test ») au moins une fois par an."},{"id":"aud-056","theme":"audit","type":"error","prompt":"We have not received all the [evidences] we requested.","answers":["We have not received all the evidence we requested."],"explanation":"« Evidence » est indénombrable : pas de pluriel. Pour compter : « a piece of evidence »."},{"id":"aud-057","theme":"audit","type":"error","prompt":"The company [did] a provision for the litigation.","answers":["The company made a provision for the litigation."],"explanation":"On dit « to make a provision » (ou « to recognise / book a provision »), jamais « to do ». « Litigation » = litige."},{"id":"aud-058","theme":"audit","type":"dictation","answers":["We have selected a sample of invoices for testing.","We've selected a sample of invoices for testing."],"explanation":"« To select a sample for testing » = sélectionner un échantillon à tester."},{"id":"aud-059","theme":"audit","type":"dictation","answers":["The client has not provided the bank statements yet.","The client hasn't provided the bank statements yet."],"explanation":"« Bank statements » = relevés bancaires. « Not… yet » + present perfect."},{"id":"aud-060","theme":"audit","type":"dictation","answers":["No material misstatements were identified."],"explanation":"Conclusion type d'une section de rapport : aucune anomalie significative n'a été relevée."},{"id":"aud-061","theme":"audit","type":"listen","audio":"We still need the signed representation letter before we can issue our report.","prompt":"Que manque-t-il à l'équipe d'audit ?","answers":["La lettre d'affirmation signée"],"distractors":["La lettre de mission signée","La lettre de recommandations","Le rapport de gestion"],"explanation":"« Representation letter » = lettre d'affirmation. « To issue a report » = émettre un rapport."},{"id":"aud-062","theme":"audit","type":"listen","audio":"The receivables balance looks overstated compared with last year.","prompt":"Que pense l'auditeur ?","answers":["Le solde des créances paraît surévalué."],"distractors":["Le solde des créances paraît sous-évalué.","Les dettes fournisseurs ont trop augmenté.","Les créances sont stables par rapport à l'an dernier."],"explanation":"« Overstated » = surévalué ; « understated » = sous-évalué.","term":"overstated","fr":"surévalué"}]},{"id":"charts","title":"Décrire un graphique ou des chiffres","icon":"📈","description":"Verbes de tendance (rise, soar, plummet, level off, peak, fluctuate), adverbes d'intensité, prépositions (by, to, from… to), pourcentages et points de pourcentage, comparaisons.","items":[{"id":"cht-001","theme":"charts","type":"fill","prompt":"Sales ___ from €2m to €5m in just one year: a spectacular increase.","hint":"monter en flèche (prétérit)","answers":["soared","rocketed","skyrocketed","surged"],"explanation":"« To soar » = monter en flèche. Synonymes : « to rocket », « to surge ».","term":"to soar","fr":"monter en flèche"},{"id":"cht-002","theme":"charts","type":"fill","prompt":"The share price ___ by 40% after the profit warning.","hint":"s'effondrer (prétérit, commence par p)","answers":["plummeted","plunged"],"explanation":"« To plummet » = chuter brutalement. « Profit warning » = avertissement sur résultats.","term":"to plummet","fr":"s'effondrer, chuter brutalement"},{"id":"cht-003","theme":"charts","type":"fill","prompt":"After two years of growth, revenue ___ off at around €10m.","hint":"se stabiliser : to ___ off (prétérit)","answers":["levelled","leveled"],"explanation":"« To level off » = se stabiliser après une hausse ou une baisse.","note":"GB : levelled · US : leveled","term":"to level off","fr":"se stabiliser"},{"id":"cht-004","theme":"charts","type":"fill","prompt":"Inflation ___ at 6.2% in October before falling back.","hint":"atteindre un pic (prétérit)","answers":["peaked"],"explanation":"« To peak at » + valeur = atteindre un pic de. Le nom : « a peak ».","term":"to peak","fr":"atteindre un pic"},{"id":"cht-005","theme":"charts","type":"fill","prompt":"Monthly orders ___ between 800 and 1,200 throughout the year.","hint":"fluctuer (prétérit)","answers":["fluctuated","varied","ranged"],"explanation":"« To fluctuate between X and Y » = fluctuer entre X et Y.","term":"to fluctuate","fr":"fluctuer"},{"id":"cht-006","theme":"charts","type":"fill","prompt":"Costs rose ___ 5%, from €200k to €210k.","hint":"préposition qui donne l'ampleur de la variation","answers":["by"],"explanation":"« To rise BY 5% » : « by » donne l'ampleur de la variation. « To rise TO 5% » voudrait dire « atteindre 5 % »."},{"id":"cht-007","theme":"charts","type":"fill","prompt":"Headcount increased from 120 ___ 150.","hint":"préposition du point d'arrivée","answers":["to"],"explanation":"« From 120 to 150 » : « from » marque le point de départ, « to » le point d'arrivée."},{"id":"cht-008","theme":"charts","type":"fill","prompt":"Revenue grew ___ over the period, by about 2% every quarter.","hint":"régulièrement","answers":["steadily","regularly","consistently"],"explanation":"« Steadily » = de façon régulière et continue. L'adverbe se place après le verbe.","term":"steadily","fr":"régulièrement"},{"id":"cht-009","theme":"charts","type":"fill","prompt":"Margins fell ___, from 30.0% to 29.8%.","hint":"légèrement","answers":["slightly","marginally"],"explanation":"« Slightly » = légèrement. Plus soutenu : « marginally ».","term":"slightly","fr":"légèrement"},{"id":"cht-010","theme":"charts","type":"fill","prompt":"Exports dropped ___ in March, losing a third of their value.","hint":"fortement, brutalement","answers":["sharply","dramatically","steeply","significantly"],"explanation":"« Sharply » = fortement, brutalement. « Dramatically » signifie « de façon spectaculaire », pas « dramatiquement ».","term":"sharply","fr":"fortement, brutalement"},{"id":"cht-011","theme":"charts","type":"fill","prompt":"The margin rose from 10% to 12%, an increase of two percentage ___.","hint":"unité de l'écart entre deux pourcentages","answers":["points"],"explanation":"De 10 % à 12 % : +2 points de pourcentage (« percentage points »), mais +20 % en valeur relative. Confondre les deux est une erreur fréquente.","term":"percentage points","fr":"points de pourcentage"},{"id":"cht-012","theme":"charts","type":"fill","prompt":"There was a sharp ___ in demand: volumes fell by a quarter.","hint":"baisse (nom)","answers":["fall","drop","decline","decrease","downturn"],"explanation":"Nom + « in » : « a fall in demand », « a rise in prices ». L'adjectif « sharp » correspond à l'adverbe « sharply ».","term":"a sharp fall in","fr":"une forte baisse de"},{"id":"cht-013","theme":"charts","type":"fill","prompt":"Sales reached a ___ of €8m in December, the highest level of the year.","hint":"pic, sommet (nom)","answers":["peak","high","record"],"explanation":"« To reach a peak of » = atteindre un pic de. Contraire : « a low », « a trough » (un creux).","term":"a peak","fr":"un pic"},{"id":"cht-014","theme":"charts","type":"fill","prompt":"Profit remained ___ at €3m for three years in a row.","hint":"sans variation (adjectif)","answers":["stable","flat","steady","constant","unchanged"],"explanation":"« To remain stable / flat / steady » = rester stable. « In a row » = d'affilée.","term":"to remain stable","fr":"rester stable"},{"id":"cht-015","theme":"charts","type":"fill","prompt":"Sales this year are twice as high ___ last year.","hint":"second terme de la comparaison (deux lettres)","answers":["as"],"explanation":"« Twice as high as » = deux fois plus élevé que. On ne dit pas « two times more high than »."},{"id":"cht-016","theme":"charts","type":"fill","prompt":"Unemployment fell to its lowest ___ in ten years.","hint":"niveau","answers":["level","point","rate"],"explanation":"« Its lowest level in ten years » = son plus bas niveau en dix ans. Notez « in », pas « since »."},{"id":"cht-017","theme":"charts","type":"fill","bank":true,"prompt":"There was an increase ___ 12% in operating costs.","answers":["of"],"distractors":["by","to","at"],"explanation":"Avec le NOM : « an increase OF 12% ». Avec le VERBE : « costs increased BY 12% »."},{"id":"cht-018","theme":"charts","type":"fill","bank":true,"prompt":"Sales stood ___ €4.5m at the end of the year.","answers":["at"],"distractors":["on","to","by"],"explanation":"« To stand at » + valeur = s'établir à. Utile pour donner un niveau, sans idée de variation."},{"id":"cht-019","theme":"charts","type":"fill","bank":true,"prompt":"Prices have ___ since January: they are 20% higher today.","answers":["risen"],"distractors":["raised","rose","arisen"],"explanation":"« To rise – rose – risen » est intransitif : les prix montent (tout seuls). « To raise » exige un complément : « the company raised its prices »."},{"id":"cht-020","theme":"charts","type":"conjugate","prompt":"Between 2021 and 2023, revenue ___ (to rise) by 18%.","answers":["rose"],"explanation":"Période terminée : past simple. Verbe irrégulier : rise – rose – risen."},{"id":"cht-021","theme":"charts","type":"conjugate","prompt":"Since the beginning of the year, raw material prices ___ (to fall) by 7%.","answers":["have fallen"],"explanation":"« Since » + point de départ : present perfect. Verbe irrégulier : fall – fell – fallen."},{"id":"cht-022","theme":"charts","type":"conjugate","prompt":"Sales ___ (to grow) steadily at the moment.","answers":["are growing"],"explanation":"« At the moment » : action en cours, donc présent continu (be + -ing)."},{"id":"cht-023","theme":"charts","type":"conjugate","prompt":"Last quarter, the company ___ (to raise) its prices by 3%.","answers":["raised"],"explanation":"« To raise » (régulier : raised) est transitif : l'entreprise augmente ses prix. À distinguer de « to rise »."},{"id":"cht-024","theme":"charts","type":"conjugate","prompt":"Analysts expect that margins ___ (to shrink) next year.","answers":["will shrink"],"explanation":"Prévision : will + base verbale. « To shrink » = se contracter, diminuer."},{"id":"cht-025","theme":"charts","type":"translate","direction":"fr-en","prompt":"une forte hausse","answers":["a sharp increase","a sharp rise","a strong increase","a steep increase","a steep rise","a significant increase","a strong rise","a big increase","a large increase","a significant rise","a substantial increase"],"explanation":"« A sharp increase / rise » = une forte hausse. Construction : « a sharp increase IN sales ».","term":"a sharp increase","fr":"une forte hausse"},{"id":"cht-026","theme":"charts","type":"translate","direction":"fr-en","prompt":"une légère baisse","answers":["a slight decrease","a slight fall","a slight drop","a slight decline","a small decrease","a small drop","a small decline","a small fall","a slight dip"],"explanation":"« A slight decrease / fall / drop » = une légère baisse.","term":"a slight decrease","fr":"une légère baisse"},{"id":"cht-027","theme":"charts","type":"translate","direction":"fr-en","prompt":"Les ventes ont doublé.","answers":["Sales doubled.","Sales have doubled.","The sales doubled.","The sales have doubled."],"explanation":"« To double » = doubler ; « to triple » = tripler ; « to halve » = diminuer de moitié."},{"id":"cht-028","theme":"charts","type":"translate","direction":"fr-en","prompt":"par rapport à l'année dernière","answers":["compared with last year","compared to last year","versus last year","in comparison with last year","against last year","year on year","year over year","in comparison to last year"],"explanation":"« Compared with / to last year ». Dans un tableau : « vs last year » ou « YoY ».","term":"compared with last year","fr":"par rapport à l'année dernière"},{"id":"cht-029","theme":"charts","type":"translate","direction":"fr-en","prompt":"une tendance à la hausse","answers":["an upward trend","a rising trend","an uptrend","an upward tendency"],"explanation":"« An upward trend » = une tendance à la hausse ; « a downward trend » = à la baisse.","term":"an upward trend","fr":"une tendance à la hausse"},{"id":"cht-030","theme":"charts","type":"translate","direction":"fr-en","prompt":"diminuer de moitié","answers":["to halve","to fall by half","to drop by half","to decrease by half","to be halved","to be cut in half","to decline by half"],"explanation":"« To halve » = diminuer de moitié. « Costs halved » ou « costs fell by half ».","term":"to halve","fr":"diminuer de moitié"},{"id":"cht-031","theme":"charts","type":"translate","direction":"fr-en","prompt":"se redresser (après une baisse)","answers":["to recover","to rebound","to bounce back","to pick up"],"explanation":"« To recover » = se redresser. « A recovery » = une reprise. Plus imagé : « to bounce back ».","term":"to recover","fr":"se redresser, repartir"},{"id":"cht-032","theme":"charts","type":"translate","direction":"en-fr","prompt":"to plummet","answers":["chuter","s'effondrer","dégringoler","plonger","chuter brutalement","s'écrouler"],"explanation":"« To plummet » = s'effondrer, chuter brutalement."},{"id":"cht-033","theme":"charts","type":"translate","direction":"en-fr","prompt":"a downward trend","answers":["une tendance à la baisse","une tendance baissière"],"explanation":"« A downward trend » = une tendance à la baisse.","term":"a downward trend","fr":"une tendance à la baisse"},{"id":"cht-034","theme":"charts","type":"translate","direction":"en-fr","prompt":"to level off","answers":["se stabiliser","plafonner","stagner","se tasser"],"explanation":"« To level off » = se stabiliser, atteindre un palier."},{"id":"cht-035","theme":"charts","type":"mcq","prompt":"Le taux de marge passe de 20 % à 25 %. Quelle phrase est exacte ?","answers":["The margin rose by five percentage points."],"distractors":["The margin rose by five percent.","The margin rose to five percentage points.","The margin rose of five percent."],"explanation":"De 20 % à 25 % : +5 points de pourcentage, soit +25 % en valeur relative. « By five percent » serait donc faux."},{"id":"cht-036","theme":"charts","type":"mcq","prompt":"The company ___ its prices in January.","answers":["raised"],"distractors":["rose","risen","arose"],"explanation":"Avec un complément d'objet (its prices), il faut « to raise ». « To rise » n'a jamais de complément."},{"id":"cht-037","theme":"charts","type":"mcq","prompt":"Quel verbe décrit la hausse la plus forte ?","answers":["to soar"],"distractors":["to edge up","to rise","to recover"],"explanation":"Du plus faible au plus fort : to edge up < to rise < to jump < to soar."},{"id":"cht-038","theme":"charts","type":"mcq","prompt":"Quel verbe décrit une très légère hausse ?","answers":["to edge up"],"distractors":["to surge","to rocket","to jump"],"explanation":"« To edge up » = progresser très légèrement. Contraire : « to edge down ».","term":"to edge up","fr":"progresser très légèrement"},{"id":"cht-039","theme":"charts","type":"mcq","prompt":"Le chiffre d'affaires passe de 100 à 90. Quelle phrase est correcte ?","answers":["Revenue fell by 10%."],"distractors":["Revenue fell to 10%.","Revenue fell of 10%.","Revenue fell at 10%."],"explanation":"« Fell BY 10% » = a baissé de 10 %. « Fell TO 10% » voudrait dire « est tombé à 10 % »."},{"id":"cht-040","theme":"charts","type":"mcq","choices":"fr","prompt":"Dans un commentaire de chiffres, que signifie « year on year » (YoY) ?","answers":["Par rapport à la même période de l'année précédente"],"distractors":["Année après année, sans interruption","Sur douze mois glissants","Du début de l'année à aujourd'hui"],"explanation":"« Sales rose 5% year on year » = +5 % par rapport à la même période de l'an dernier. Douze mois glissants = « rolling twelve months » ; depuis le début de l'année = « year to date ».","note":"GB : year on year · US : year over year","term":"year on year (YoY)","fr":"par rapport à la même période de l'an dernier"},{"id":"cht-041","theme":"charts","type":"mcq","prompt":"Profit was three times ___ in 2023 than in 2022.","answers":["higher"],"distractors":["high","more high","highest"],"explanation":"Comparatif des adjectifs courts : adjectif + -er + than (higher than). Avec « as » : « three times as high as »."},{"id":"cht-042","theme":"charts","type":"mcq","prompt":"The figures show a ___ recovery: growth is slow but regular.","answers":["gradual"],"distractors":["sudden","sharp","dramatic"],"explanation":"« Gradual » = progressif. Les trois autres adjectifs décrivent un mouvement brutal.","term":"gradual","fr":"progressif"},{"id":"cht-043","theme":"charts","type":"order","prompt":"Les ventes ont fortement augmenté au deuxième trimestre.","answers":["Sales rose sharply in the second quarter.","In the second quarter sales rose sharply.","Sales sharply rose in the second quarter."],"explanation":"Ordre habituel : sujet + verbe + adverbe + complément de temps."},{"id":"cht-044","theme":"charts","type":"order","prompt":"Le chiffre d'affaires a baissé de dix pour cent l'an dernier.","answers":["Revenue fell by ten percent last year.","Last year revenue fell by ten percent."],"explanation":"« Fell by ten percent » : « by » donne l'ampleur de la baisse.","note":"GB : per cent (en deux mots) · US : percent"},{"id":"cht-045","theme":"charts","type":"order","prompt":"Le nombre de clients a doublé depuis janvier.","answers":["The number of customers has doubled since January.","Since January the number of customers has doubled."],"explanation":"« The number of » + pluriel est suivi d'un verbe au singulier : has doubled."},{"id":"cht-046","theme":"charts","type":"order","prompt":"Les coûts sont restés stables tout au long de l'année.","answers":["Costs remained stable throughout the year.","Throughout the year costs remained stable."],"explanation":"« Throughout the year » = tout au long de l'année."},{"id":"cht-047","theme":"charts","type":"order","prompt":"Le bénéfice devrait augmenter l'an prochain.","answers":["Profit is expected to rise next year.","Next year profit is expected to rise."],"explanation":"« Is expected to » + base verbale = devrait (prévision prudente, très courante dans les commentaires financiers)."},{"id":"cht-048","theme":"charts","type":"order","prompt":"Il y a eu une légère hausse des charges d'exploitation.","answers":["There was a slight increase in operating costs."],"explanation":"« An increase IN » + ce qui augmente. « There was » introduit un constat."},{"id":"cht-049","theme":"charts","type":"match","pairs":[["to soar","monter en flèche"],["to plummet","s'effondrer"],["to level off","se stabiliser"],["to fluctuate","fluctuer"]],"explanation":"Quatre verbes pour quatre formes de courbe."},{"id":"cht-050","theme":"charts","type":"match","pairs":[["sharply","fortement"],["slightly","légèrement"],["steadily","régulièrement"],["gradually","progressivement"]],"explanation":"Les adverbes d'intensité précisent le verbe de tendance : « rose sharply », « fell slightly »."},{"id":"cht-051","theme":"charts","type":"match","pairs":[["a peak","un pic"],["a trough","un creux"],["a trend","une tendance"],["a plateau","un palier"]],"explanation":"« Trough » se prononce « trof »."},{"id":"cht-052","theme":"charts","type":"error","prompt":"Prices have [raised] by 5% since January.","answers":["Prices have risen by 5% since January."],"explanation":"Sans complément d'objet, il faut « to rise » (rise – rose – risen). « To raise » = augmenter quelque chose."},{"id":"cht-053","theme":"charts","type":"error","prompt":"Sales increased [of] 10% compared with last year.","answers":["Sales increased by 10% compared with last year."],"explanation":"Verbe + « by » : increased BY 10%. « Of » ne s'emploie qu'après le nom : an increase of 10%."},{"id":"cht-054","theme":"charts","type":"error","prompt":"There was a sharp increase [of] energy prices last winter.","answers":["There was a sharp increase in energy prices last winter."],"explanation":"« An increase IN » + ce qui augmente ; « an increase OF » + le montant de la hausse."},{"id":"cht-055","theme":"charts","type":"error","prompt":"Costs rose by five [percents] last year.","answers":["Costs rose by five percent last year."],"explanation":"« Percent » est invariable : five percent, jamais « percents »."},{"id":"cht-056","theme":"charts","type":"dictation","answers":["Sales fell slightly in the first half."],"explanation":"« The first half » (H1) = le premier semestre."},{"id":"cht-057","theme":"charts","type":"dictation","answers":["Profit remained stable over the period."],"explanation":"« Over the period » = sur la période."},{"id":"cht-058","theme":"charts","type":"dictation","answers":["Costs have risen steadily since January."],"explanation":"Present perfect avec « since » ; adverbe « steadily » après le participe."},{"id":"cht-059","theme":"charts","type":"listen","audio":"Revenue rose by three percent, to twelve million euros.","prompt":"Quelle information est exacte ?","answers":["Le chiffre d'affaires a augmenté de 3 % pour atteindre 12 millions d'euros."],"distractors":["Le chiffre d'affaires a augmenté de 12 % pour atteindre 3 millions d'euros.","Le chiffre d'affaires a augmenté de 3 millions pour atteindre 12 %.","Le chiffre d'affaires a baissé de 3 % à 12 millions d'euros."],"explanation":"« By » donne l'ampleur de la variation, « to » le niveau atteint."},{"id":"cht-060","theme":"charts","type":"listen","audio":"After peaking in June, orders levelled off over the summer.","prompt":"Que décrit cette phrase ?","answers":["Les commandes ont atteint un pic en juin, puis se sont stabilisées pendant l'été."],"distractors":["Les commandes ont chuté en juin, puis sont reparties à la hausse pendant l'été.","Les commandes ont augmenté tout l'été après un creux en juin.","Les commandes ont fortement fluctué entre juin et la fin de l'été."],"explanation":"« To peak » = atteindre un pic ; « to level off » = se stabiliser."},{"id":"cht-101","theme":"charts","type":"chart","chart":{"kind":"line","title":"Revenue (€m)","prefix":"€","unit":"m","labels":["2019","2020","2021","2022","2023"],"series":[{"values":[10,13,16,19,22]}]},"answers":["Revenue rose steadily from €10m in 2019 to €22m in 2023."],"distractors":["Revenue fluctuated between 2019 and 2023.","Revenue levelled off after 2020.","Revenue fell steadily from 2019 to 2023."],"explanation":"Hausse régulière de 3 millions par an : « rose steadily ». « From… to… » encadre les valeurs de départ et d'arrivée."},{"id":"cht-102","theme":"charts","type":"chart","chart":{"kind":"line","title":"Share price (€)","prefix":"€","labels":["Jan","Feb","Mar","Apr","May","Jun"],"series":[{"values":[50,52,51,53,30,31]}]},"answers":["The share price plummeted in May."],"distractors":["The share price soared in May.","The share price peaked in May.","The share price remained stable in May."],"explanation":"Chute brutale de 53 € à 30 € : « plummeted ». Le pic (peak) est en avril."},{"id":"cht-103","theme":"charts","type":"chart","chart":{"kind":"bar","title":"Quarterly sales (€k)","prefix":"€","unit":"k","labels":["Q1","Q2","Q3","Q4"],"series":[{"values":[400,420,410,800]}]},"answers":["Sales almost doubled in the fourth quarter."],"distractors":["Sales halved in the fourth quarter.","Sales levelled off in the fourth quarter.","Sales rose slightly in the fourth quarter."],"explanation":"De 410 à 800 : les ventes ont presque doublé (« almost doubled »). « To halve » = diminuer de moitié."},{"id":"cht-104","theme":"charts","type":"chart","chart":{"kind":"line","title":"Monthly orders","labels":["Jan","Feb","Mar","Apr","May","Jun"],"series":[{"values":[100,140,90,150,95,145]}]},"answers":["Orders fluctuated throughout the period."],"distractors":["Orders rose steadily throughout the period.","Orders remained flat throughout the period.","Orders fell steadily throughout the period."],"explanation":"Des hausses et des baisses successives : « fluctuated »."},{"id":"cht-105","theme":"charts","type":"chart","chart":{"kind":"line","title":"Operating margin (%)","unit":"%","labels":["2020","2021","2022","2023","2024"],"series":[{"values":[8,10,12,12,12]}]},"answers":["The margin rose until 2022 and then levelled off at 12%."],"distractors":["The margin peaked in 2021 and then fell.","The margin rose steadily throughout the period.","The margin fell until 2022 and then recovered."],"explanation":"Hausse jusqu'en 2022, puis palier à 12 % : « levelled off at 12% ».","note":"GB : levelled off · US : leveled off"},{"id":"cht-106","theme":"charts","type":"chart","chart":{"kind":"bar","title":"Headcount","labels":["2021","2022","2023"],"series":[{"values":[200,210,250]}]},"prompt":"Headcount rose ___ 200 in 2021 to 250 in 2023.","hint":"préposition du point de départ","answers":["from"],"explanation":"« From 200… to 250 » : point de départ, puis point d'arrivée."},{"id":"cht-107","theme":"charts","type":"chart","chart":{"kind":"line","title":"Inflation (%)","unit":"%","labels":["Jan","Feb","Mar","Apr","May","Jun"],"series":[{"values":[2,3,5,7,6,4]}]},"prompt":"Inflation ___ at 7% in April before falling back.","hint":"atteindre un pic (prétérit)","answers":["peaked"],"explanation":"Le point le plus haut de la courbe : « peaked at 7% »."},{"id":"cht-108","theme":"charts","type":"chart","chart":{"kind":"bar","title":"Costs: budget vs actual (€k)","prefix":"€","unit":"k","labels":["Q1","Q2","Q3","Q4"],"series":[{"name":"Budget","values":[100,100,100,100]},{"name":"Actual","values":[95,104,110,100]}]},"answers":["Actual costs exceeded the budget by 10% in the third quarter."],"distractors":["Actual costs were 10% below budget in the third quarter.","Actual costs were in line with budget in the third quarter.","Actual costs exceeded the budget in every quarter."],"explanation":"Au T3 : 110 de réel pour 100 de budget, soit un dépassement de 10 %. Au T1, le réel est inférieur au budget ; au T4, il lui est égal."},{"id":"cht-109","theme":"charts","type":"chart","chart":{"kind":"line","title":"Net profit (€m)","prefix":"€","unit":"m","labels":["2020","2021","2022","2023"],"series":[{"values":[5,5,5,5]}]},"prompt":"Net profit remained ___ at €5m over the four years.","hint":"sans variation (adjectif)","answers":["stable","flat","steady","constant","unchanged"],"explanation":"Aucune variation : « remained stable / flat / unchanged »."},{"id":"cht-110","theme":"charts","type":"chart","chart":{"kind":"bar","title":"Sales by country (€m)","prefix":"€","unit":"m","labels":["France","Germany","Spain","Italy"],"series":[{"values":[40,20,10,10]}]},"answers":["Sales in France were twice as high as in Germany."],"distractors":["Sales in Germany were twice as high as in France.","Sales in Spain were higher than in Italy.","Sales in France were three times as high as in Germany."],"explanation":"40 contre 20 : « twice as high as ». L'Espagne et l'Italie sont au même niveau."},{"id":"cht-111","theme":"charts","type":"chart","chart":{"kind":"line","title":"Monthly costs (€k)","prefix":"€","unit":"k","labels":["Jan","Feb","Mar","Apr"],"series":[{"values":[200,198,196,195]}]},"answers":["Costs fell slightly over the period."],"distractors":["Costs fell sharply over the period.","Costs soared over the period.","Costs fluctuated widely over the period."],"explanation":"De 200 à 195 en quatre mois : une baisse légère, « fell slightly »."},{"id":"cht-112","theme":"charts","type":"chart","chart":{"kind":"line","title":"Market share (%)","unit":"%","labels":["2021","2022","2023"],"series":[{"values":[20,22,25]}]},"answers":["Market share gained five percentage points between 2021 and 2023."],"distractors":["Market share rose by five percent between 2021 and 2023.","Market share rose to five percent in 2023.","Market share lost five percentage points between 2021 and 2023."],"explanation":"De 20 % à 25 % : +5 points de pourcentage. En valeur relative, la hausse est de 25 %, pas de 5 %."},{"id":"cht-113","theme":"charts","type":"chart","chart":{"kind":"bar","title":"Revenue (€m)","prefix":"€","unit":"m","labels":["2022","2023"],"series":[{"values":[50,45]}]},"prompt":"Revenue fell ___ 10% between 2022 and 2023.","hint":"préposition qui donne l'ampleur","answers":["by"],"explanation":"De 50 à 45 : une baisse DE 10 %, « fell by 10% »."},{"id":"cht-114","theme":"charts","type":"chart","chart":{"kind":"line","title":"Sales by product (€k)","prefix":"€","unit":"k","labels":["Q1","Q2","Q3","Q4"],"series":[{"name":"Product A","values":[100,120,140,160]},{"name":"Product B","values":[150,140,130,120]}]},"answers":["Product A overtook Product B in the third quarter."],"distractors":["Product B overtook Product A in the third quarter.","Product A outsold Product B in every quarter.","Both products followed an upward trend."],"explanation":"« To overtake » = dépasser. Au T3, A (140) passe devant B (130). « To outsell » = se vendre mieux que."},{"id":"cht-115","theme":"charts","type":"chart","chart":{"kind":"line","title":"Cash position (€m)","prefix":"€","unit":"m","labels":["Jan","Feb","Mar","Apr","May"],"series":[{"values":[10,6,3,5,9]}]},"answers":["Cash bottomed out in March and then recovered."],"distractors":["Cash peaked in March and then declined.","Cash fell steadily throughout the period.","Cash levelled off after March."],"explanation":"« To bottom out » = toucher son point bas (le contraire de « to peak ») ; « to recover » = se redresser.","term":"to bottom out","fr":"toucher son point bas"},{"id":"cht-116","theme":"charts","type":"chart","chart":{"kind":"bar","title":"Units sold","labels":["2021","2022","2023"],"series":[{"values":[1000,1500,3000]}]},"prompt":"Unit sales ___ between 2022 and 2023, from 1,500 to 3,000.","hint":"doubler (prétérit)","answers":["doubled"],"explanation":"De 1 500 à 3 000 : les ventes ont doublé, « doubled »."},{"id":"cht-117","theme":"charts","type":"chart","chart":{"kind":"line","title":"Monthly sales (€k)","prefix":"€","unit":"k","labels":["Jan","Feb","Mar","Apr","May"],"series":[{"values":[80,82,85,120,122]}]},"prompt":"Sales rose ___ in April, jumping from €85k to €120k.","hint":"fortement","answers":["sharply","dramatically","steeply","significantly","suddenly","strongly"],"explanation":"Une hausse brutale d'un mois sur l'autre : « rose sharply »."},{"id":"cht-118","theme":"charts","type":"chart","chart":{"kind":"bar","title":"Gross margin (%)","unit":"%","labels":["2021","2022","2023"],"series":[{"values":[30,28,25]}]},"answers":["The gross margin has been on a downward trend since 2021."],"distractors":["The gross margin has been on an upward trend since 2021.","The gross margin has remained stable since 2021.","The gross margin recovered in 2023."],"explanation":"Baisse continue : « on a downward trend ». Present perfect avec « since »."}]},{"id":"presenting","title":"Présenter des résultats","icon":"🎤","description":"Structurer une présentation, commenter un écart, justifier une hypothèse, répondre à une question difficile.","items":[{"id":"prs-001","theme":"presenting","type":"fill","prompt":"I'd like to start by giving you an ___ of our third-quarter results.","hint":"vue d'ensemble","answers":["overview","outline"],"explanation":"« To give an overview of » = donner une vue d'ensemble de. Idéal pour ouvrir une présentation.","term":"an overview","fr":"une vue d'ensemble"},{"id":"prs-002","theme":"presenting","type":"fill","prompt":"My presentation is divided ___ three parts.","hint":"préposition : divisé en","answers":["into"],"explanation":"« Divided into » : après « to divide », la préposition est « into », pas « in »."},{"id":"prs-003","theme":"presenting","type":"fill","prompt":"Let's now ___ to the cost analysis.","hint":"se tourner vers, passer à","answers":["turn","move","go"],"explanation":"« Let's now turn to… » : transition classique vers la partie suivante.","term":"Let's now turn to","fr":"Passons maintenant à"},{"id":"prs-004","theme":"presenting","type":"fill","prompt":"As you can ___ from this chart, margins have improved.","hint":"voir","answers":["see","tell"],"explanation":"« As you can see from this chart » = comme le montre ce graphique.","term":"As you can see from this chart","fr":"Comme le montre ce graphique"},{"id":"prs-005","theme":"presenting","type":"fill","prompt":"The shortfall is mainly ___ to the delayed product launch.","hint":"dû à : ___ to","answers":["due","attributable","down","owing"],"explanation":"« Due to » + nom = dû à. Plus soutenu : « attributable to ». « Shortfall » = manque à gagner.","term":"due to","fr":"dû à"},{"id":"prs-006","theme":"presenting","type":"fill","prompt":"Our forecast is ___ on the assumption that volumes will grow by 3%.","hint":"fondé sur : ___ on","answers":["based","built","predicated"],"explanation":"« Based on the assumption that… » = fondé sur l'hypothèse que… : la formule pour justifier une hypothèse.","term":"based on the assumption that","fr":"fondé sur l'hypothèse que"},{"id":"prs-007","theme":"presenting","type":"fill","prompt":"I'm afraid I don't have that figure to ___, but I'll get back to you today.","hint":"sous la main : to ___","answers":["hand"],"explanation":"« To have something to hand » = avoir quelque chose sous la main. Mieux vaut promettre une réponse que d'improviser un chiffre.","note":"GB : to hand · US : on hand","term":"to have something to hand","fr":"avoir quelque chose sous la main"},{"id":"prs-008","theme":"presenting","type":"fill","prompt":"That's a fair ___. Let me explain how we calculated the provision.","hint":"remarque","answers":["point","question","comment","remark"],"explanation":"« That's a fair point » = c'est une remarque pertinente. On accueille l'objection avant d'y répondre.","term":"That's a fair point.","fr":"C'est une remarque pertinente."},{"id":"prs-009","theme":"presenting","type":"fill","prompt":"In ___, we are on track to meet our full-year targets.","hint":"formule pour terminer : in ___","answers":["conclusion","summary","short","brief"],"explanation":"« In conclusion » ou « In summary » pour conclure. « On track » = en bonne voie."},{"id":"prs-010","theme":"presenting","type":"fill","prompt":"Let me ___ down the variance into price and volume effects.","hint":"décomposer : to ___ down","answers":["break"],"explanation":"« To break down a variance into… » = décomposer un écart en effet prix et effet volume.","term":"to break down","fr":"décomposer, ventiler"},{"id":"prs-011","theme":"presenting","type":"fill","prompt":"The key ___ from this slide is that cash generation has doubled.","hint":"point à retenir (commence par t)","answers":["takeaway","take-away"],"explanation":"« The key takeaway » = le point essentiel à retenir.","term":"the key takeaway","fr":"le point essentiel à retenir"},{"id":"prs-012","theme":"presenting","type":"fill","prompt":"This increase is partly ___ by lower marketing spend.","hint":"compensé","answers":["offset","compensated","balanced"],"explanation":"« To be offset by » = être compensé par. « Offset » est invariable : offset – offset – offset.","term":"to be offset by","fr":"être compensé par"},{"id":"prs-013","theme":"presenting","type":"fill","prompt":"We took a ___ approach and assumed no price increase.","hint":"qui ne prend pas de risque (adjectif)","answers":["conservative","prudent","cautious"],"explanation":"« A conservative assumption » = une hypothèse prudente. Ici, « conservative » n'a aucun sens politique.","term":"a conservative assumption","fr":"une hypothèse prudente"},{"id":"prs-014","theme":"presenting","type":"fill","prompt":"Excluding one-___ items, operating profit rose by 6%.","hint":"exceptionnels, non récurrents : one-___","answers":["off"],"explanation":"« One-off items » = éléments exceptionnels, non récurrents.","note":"GB : one-off items · US : one-time items","term":"one-off items","fr":"éléments non récurrents"},{"id":"prs-015","theme":"presenting","type":"fill","prompt":"This brings me to my next ___: working capital.","hint":"sujet, élément suivant","answers":["point","topic","slide"],"explanation":"« This brings me to my next point » : transition fluide. « Working capital » = besoin en fonds de roulement (BFR)."},{"id":"prs-016","theme":"presenting","type":"fill","bank":true,"prompt":"I'll be happy to take questions ___ the end.","answers":["at"],"distractors":["in","on","to"],"explanation":"« At the end » = à la fin (d'un événement). « In the end » signifie « finalement »."},{"id":"prs-017","theme":"presenting","type":"fill","bank":true,"prompt":"This slide ___ the breakdown of revenue by region.","answers":["shows"],"distractors":["tells","speaks","says"],"explanation":"Une diapositive « shows » (montre). « Breakdown » = ventilation, répartition."},{"id":"prs-018","theme":"presenting","type":"fill","bank":true,"prompt":"Could you go back ___ the previous slide, please?","answers":["to"],"distractors":["at","on","in"],"explanation":"« To go back to » = revenir à."},{"id":"prs-019","theme":"presenting","type":"conjugate","prompt":"If raw material prices ___ (to rise) by 10%, our margin would fall by two points.","answers":["rose","were to rise"],"explanation":"Hypothèse (analyse de sensibilité) : « if » + prétérit, puis « would » + base verbale."},{"id":"prs-020","theme":"presenting","type":"conjugate","prompt":"We ___ (to assume) a stable exchange rate when we built the budget last year.","answers":["assumed"],"explanation":"Action passée et datée : past simple. « To assume » = prendre pour hypothèse."},{"id":"prs-021","theme":"presenting","type":"conjugate","prompt":"Had we known about the delay, we ___ (to revise) the forecast earlier.","answers":["would have revised","would've revised"],"explanation":"Irréel du passé : « Had we known » (= if we had known) + would have + participe passé."},{"id":"prs-022","theme":"presenting","type":"conjugate","prompt":"As I ___ (to mention) earlier, the third quarter was affected by a strike.","answers":["mentioned"],"explanation":"« As I mentioned earlier » = comme je l'ai indiqué tout à l'heure : past simple."},{"id":"prs-023","theme":"presenting","type":"conjugate","prompt":"Next, I ___ (to walk) you through the main variances.","answers":["will walk","'ll walk","am going to walk","'m going to walk"],"explanation":"Annonce de ce qui suit : futur. « To walk someone through » = présenter pas à pas."},{"id":"prs-024","theme":"presenting","type":"translate","direction":"fr-en","prompt":"une hypothèse","answers":["an assumption","a hypothesis"],"explanation":"En finance, une hypothèse (de budget, de prévision) se dit « an assumption ». « Hypothesis » est réservé au contexte scientifique.","term":"an assumption","fr":"une hypothèse"},{"id":"prs-025","theme":"presenting","type":"translate","direction":"fr-en","prompt":"Avez-vous des questions ?","answers":["Do you have any questions?","Are there any questions?","Any questions?","Have you got any questions?","Do you have questions?"],"explanation":"« Do you have any questions? » : « any » dans une question."},{"id":"prs-026","theme":"presenting","type":"translate","direction":"fr-en","prompt":"Je reviendrai sur ce point plus tard.","answers":["I'll come back to this point later.","I'll come back to that point later.","I'll come back to this later.","I'll come back to that later.","I'll return to this point later.","I'll get back to this point later."],"explanation":"« I'll come back to this point later » : pratique pour différer une question sans l'ignorer."},{"id":"prs-027","theme":"presenting","type":"translate","direction":"fr-en","prompt":"en d'autres termes","answers":["in other words"],"explanation":"« In other words » = en d'autres termes, autrement dit.","term":"in other words","fr":"en d'autres termes"},{"id":"prs-028","theme":"presenting","type":"translate","direction":"fr-en","prompt":"à périmètre constant","answers":["like for like","on a like-for-like basis","at constant scope","on a comparable basis","like-for-like"],"explanation":"« Like for like » (LFL) = à périmètre constant, hors acquisitions et cessions.","term":"like for like","fr":"à périmètre constant"},{"id":"prs-029","theme":"presenting","type":"translate","direction":"fr-en","prompt":"hors éléments exceptionnels","answers":["excluding one-off items","excluding exceptional items","excluding one-time items","before exceptional items","excluding non-recurring items","before one-off items"],"explanation":"« Excluding one-off items » = hors éléments exceptionnels."},{"id":"prs-030","theme":"presenting","type":"translate","direction":"fr-en","prompt":"Bonne question.","answers":["Good question.","That's a good question.","Great question."],"explanation":"« That's a good question » permet aussi de gagner un instant de réflexion."},{"id":"prs-031","theme":"presenting","type":"translate","direction":"fr-en","prompt":"les perspectives (pour l'année à venir)","answers":["the outlook","outlook","the prospects"],"explanation":"« The outlook » = les perspectives. « The outlook for next year is positive. »","term":"the outlook","fr":"les perspectives"},{"id":"prs-032","theme":"presenting","type":"translate","direction":"en-fr","prompt":"a rough estimate","answers":["une estimation approximative","une estimation grossière","une approximation","un ordre de grandeur","une estimation","une estimation rapide"],"explanation":"« A rough estimate » = une estimation approximative.","term":"a rough estimate","fr":"une estimation approximative"},{"id":"prs-033","theme":"presenting","type":"translate","direction":"en-fr","prompt":"the bottom line","answers":["le résultat net","le résultat","le bénéfice net","la dernière ligne"],"explanation":"« The bottom line » = le résultat net (dernière ligne du compte de résultat). Au figuré : l'essentiel. « The top line » = le chiffre d'affaires.","term":"the bottom line","fr":"le résultat net"},{"id":"prs-034","theme":"presenting","type":"translate","direction":"en-fr","prompt":"to outline","answers":["présenter les grandes lignes","exposer les grandes lignes","donner les grandes lignes","esquisser","résumer","présenter dans les grandes lignes"],"explanation":"« To outline » = présenter les grandes lignes. « Let me outline the plan. »","term":"to outline","fr":"présenter les grandes lignes de"},{"id":"prs-035","theme":"presenting","type":"mcq","prompt":"On vous pose une question dont vous n'avez pas la réponse. Que dites-vous ?","answers":["I don't have the exact figure with me, but I'll check and get back to you."],"distractors":["I don't know.","This is not my job.","Why are you asking me that?"],"explanation":"On reconnaît la limite et on s'engage à revenir avec la réponse (« I'll get back to you »)."},{"id":"prs-036","theme":"presenting","type":"mcq","prompt":"Vous voulez gagner quelques secondes de réflexion face à une question délicate. Que dites-vous ?","answers":["That's an interesting question. Let me think about it for a second."],"distractors":["Wait.","It's a too difficult question.","I refuse to answer that."],"explanation":"Valoriser la question puis annoncer un temps de réflexion est parfaitement admis."},{"id":"prs-037","theme":"presenting","type":"mcq","prompt":"Quelle phrase annonce correctement le plan d'une présentation ?","answers":["First, I'll go through the figures; then I'll explain the main variances; finally, I'll present the outlook."],"distractors":["At first I go through the figures, after the variances, at the end the outlook.","Firstly figures, in a second time variances, in a third time outlook.","I begin by the figures and I finish by the outlook after the variances."],"explanation":"« First… then… finally… » avec le futur. « In a second time » n'existe pas en anglais ; « at first » signifie « au début (mais ensuite…) »."},{"id":"prs-038","theme":"presenting","type":"mcq","prompt":"Quelle phrase commente le mieux un écart défavorable devant un directeur financier ?","answers":["Costs came in 5% over budget, mainly because of higher energy prices."],"distractors":["The costs are bad because of energy.","Costs exploded, it's a catastrophe with energy.","We have a problem of costs caused from energy."],"explanation":"Un bon commentaire d'écart est factuel : le chiffre, le sens de l'écart, la cause principale."},{"id":"prs-039","theme":"presenting","type":"mcq","choices":"fr","prompt":"Que signifie « to drill down into the figures » ?","answers":["Entrer dans le détail des chiffres"],"distractors":["Arrondir les chiffres","Revoir les chiffres à la baisse","Présenter les chiffres en public"],"explanation":"« To drill down » = descendre à un niveau de détail plus fin (par région, par produit…).","term":"to drill down into","fr":"entrer dans le détail de"},{"id":"prs-040","theme":"presenting","type":"mcq","prompt":"Sales grew by 8%, ___ costs rose by only 2%.","answers":["whereas"],"distractors":["despite","however","moreover"],"explanation":"« Whereas » (ou « while ») oppose deux propositions dans la même phrase. « However » ouvre une nouvelle phrase ; « despite » est suivi d'un nom."},{"id":"prs-041","theme":"presenting","type":"mcq","prompt":"___ the difficult market, we managed to increase our margin.","answers":["Despite"],"distractors":["Although","However","Whereas"],"explanation":"« Despite » + nom = malgré. « Although » serait suivi d'une proposition : « Although the market was difficult, … »."},{"id":"prs-042","theme":"presenting","type":"mcq","prompt":"Vous justifiez une hypothèse de croissance. Quelle formulation est la plus convaincante ?","answers":["We assumed 3% growth, in line with the average of the last three years."],"distractors":["We think 3% growth because it's normal.","3% growth is my feeling.","We hope 3% growth, like always."],"explanation":"Une hypothèse se justifie par une référence objective : historique, marché, contrat signé."},{"id":"prs-043","theme":"presenting","type":"mcq","choices":"fr","prompt":"Que signifie « a ballpark figure » ?","answers":["Un ordre de grandeur"],"distractors":["Un chiffre audité","Un chiffre confidentiel","Un chiffre record"],"explanation":"« A ballpark figure » = un ordre de grandeur, une estimation approximative. Expression d'origine américaine, comprise partout.","term":"a ballpark figure","fr":"un ordre de grandeur"},{"id":"prs-044","theme":"presenting","type":"order","prompt":"Laissez-moi vous présenter les chiffres clés pas à pas.","answers":["Let me walk you through the key figures."],"explanation":"« Let me walk you through… » = laissez-moi vous présenter… pas à pas."},{"id":"prs-045","theme":"presenting","type":"order","prompt":"Cette diapositive montre la ventilation des coûts.","answers":["This slide shows the breakdown of costs."],"explanation":"« This slide shows… » : formule simple pour introduire un visuel."},{"id":"prs-046","theme":"presenting","type":"order","prompt":"Je reviendrai sur ce point plus tard.","answers":["I will come back to this point later.","Later I will come back to this point.","I will later come back to this point."],"explanation":"« To come back to a point » = revenir sur un point."},{"id":"prs-047","theme":"presenting","type":"order","prompt":"La hausse s'explique principalement par des volumes plus élevés.","answers":["The increase is mainly due to higher volumes."],"explanation":"« Mainly due to » + groupe nominal."},{"id":"prs-048","theme":"presenting","type":"order","prompt":"Est-ce que cela répond à votre question ?","answers":["Does that answer your question?"],"explanation":"Formule utile pour vérifier que la réponse a satisfait votre interlocuteur."},{"id":"prs-049","theme":"presenting","type":"order","prompt":"Nous avons fondé notre prévision sur les chiffres de l'an dernier.","answers":["We based our forecast on last year's figures."],"explanation":"« To base something on » = fonder quelque chose sur."},{"id":"prs-050","theme":"presenting","type":"match","pairs":[["First of all","Tout d'abord"],["Moving on to","Passons à"],["To sum up","Pour résumer"],["In other words","Autrement dit"]],"explanation":"Les connecteurs structurent la présentation et guident l'auditoire."},{"id":"prs-051","theme":"presenting","type":"match","pairs":[["assumption","hypothèse"],["outlook","perspectives"],["breakdown","ventilation"],["shortfall","manque à gagner"]],"explanation":"Quatre noms indispensables pour présenter des résultats."},{"id":"prs-052","theme":"presenting","type":"error","prompt":"Let me [precise] that these figures are unaudited.","answers":["Let me specify that these figures are unaudited."],"explanation":"« Precise » est un adjectif (précis). Le verbe « préciser » se traduit par « to specify » ou « to clarify »."},{"id":"prs-053","theme":"presenting","type":"error","prompt":"This table [resumes] our main results for the year.","answers":["This table summarises our main results for the year."],"explanation":"Faux ami : « to resume » = reprendre (après une pause). Résumer = « to summarise ».","note":"GB : summarise · US : summarize"},{"id":"prs-054","theme":"presenting","type":"error","prompt":"The results are much better [that] last year.","answers":["The results are much better than last year."],"explanation":"Après un comparatif : « than ». « That » est un pronom relatif ou une conjonction."},{"id":"prs-055","theme":"presenting","type":"error","prompt":"I would like to [expose] our results for the third quarter.","answers":["I would like to present our results for the third quarter."],"explanation":"Faux ami : « to expose » = dévoiler (un scandale), exposer (à un risque). Exposer des résultats = « to present »."},{"id":"prs-056","theme":"presenting","type":"dictation","answers":["Let's move on to the next slide."],"explanation":"« To move on to » = passer à."},{"id":"prs-057","theme":"presenting","type":"dictation","answers":["I'll be happy to answer your questions.","I will be happy to answer your questions."],"explanation":"« I'll be happy to… » = je répondrai volontiers à…"},{"id":"prs-058","theme":"presenting","type":"dictation","answers":["The figures speak for themselves."],"explanation":"« The figures speak for themselves » = les chiffres parlent d'eux-mêmes."},{"id":"prs-059","theme":"presenting","type":"listen","audio":"I'm afraid that's outside the scope of today's presentation, but I'm happy to discuss it afterwards.","prompt":"Que fait l'orateur ?","answers":["Il écarte poliment une question hors sujet et propose d'en parler après."],"distractors":["Il refuse sèchement de répondre.","Il répond à la question en détail.","Il demande que l'on répète la question."],"explanation":"« Outside the scope of » = hors du périmètre de. Une façon élégante de ne pas se laisser détourner."},{"id":"prs-060","theme":"presenting","type":"listen","audio":"Let me put these figures into perspective.","prompt":"Que va faire l'orateur ?","answers":["Replacer les chiffres dans leur contexte"],"distractors":["Corriger des chiffres erronés","Distribuer un document imprimé","Passer directement à la conclusion"],"explanation":"« To put something into perspective » = remettre quelque chose en perspective, dans son contexte.","term":"to put into perspective","fr":"remettre en perspective"}]},{"id":"false-friends","title":"Faux amis et pièges","icon":"⚠️","description":"Actually, eventually, control / check, achieve, sensible, library… et les erreurs typiques des francophones : since / for, make / do, information sans -s, prépositions.","items":[{"id":"ffr-001","theme":"false-friends","type":"fill","prompt":"The meeting is at 3 p.m. — ___, sorry, it's at 4 p.m.","hint":"en fait","answers":["actually"],"explanation":"« Actually » = en fait, en réalité. Il sert souvent à corriger ou à nuancer. « Actuellement » se dit « currently ».","term":"actually","fr":"en fait, en réalité"},{"id":"ffr-002","theme":"false-friends","type":"fill","prompt":"We are ___ recruiting two junior auditors.","hint":"actuellement","answers":["currently","presently"],"explanation":"« Currently » = actuellement. On peut aussi dire « at the moment » en fin de phrase.","term":"currently","fr":"actuellement"},{"id":"ffr-003","theme":"false-friends","type":"fill","prompt":"After three reminders, the client ___ sent the documents.","hint":"finalement","answers":["eventually","finally"],"explanation":"« Eventually » = finalement, au bout du compte. Rien à voir avec « éventuellement ».","term":"eventually","fr":"finalement, au bout du compte"},{"id":"ffr-004","theme":"false-friends","type":"fill","prompt":"We could ___ postpone the deadline, but it is not certain.","hint":"éventuellement","answers":["possibly","potentially","perhaps","maybe"],"explanation":"« Éventuellement » = « possibly » : cela peut arriver, sans certitude.","term":"possibly","fr":"éventuellement"},{"id":"ffr-005","theme":"false-friends","type":"fill","prompt":"Could you ___ these figures before I send the report?","hint":"vérifier","answers":["check","verify","double-check","review"],"explanation":"Vérifier = « to check ». « To control » signifie maîtriser ou diriger : « to control costs » = maîtriser les coûts.","term":"to check","fr":"vérifier, contrôler"},{"id":"ffr-006","theme":"false-friends","type":"fill","prompt":"We ___ our sales target two months ahead of schedule.","hint":"atteindre (prétérit)","answers":["achieved","reached","met","hit"],"explanation":"« To achieve a target » = atteindre un objectif. « Achever » se dit « to complete » ou « to finish ».","term":"to achieve a target","fr":"atteindre un objectif"},{"id":"ffr-007","theme":"false-friends","type":"fill","prompt":"That's a ___ suggestion: it is realistic and easy to implement.","hint":"raisonnable, sensé","answers":["sensible","reasonable"],"explanation":"« Sensible » = raisonnable, sensé. L'adjectif français « sensible » se traduit par « sensitive ».","term":"sensible","fr":"raisonnable, sensé"},{"id":"ffr-008","theme":"false-friends","type":"fill","prompt":"Payroll data is highly ___ and must be kept confidential.","hint":"sensible, délicat","answers":["sensitive"],"explanation":"« Sensitive data » = données sensibles. « Payroll » = la paie.","term":"sensitive","fr":"sensible, délicat"},{"id":"ffr-009","theme":"false-friends","type":"fill","prompt":"I have worked in this team ___ three years.","hint":"depuis (une durée)","answers":["for"],"explanation":"« For » + durée (for three years) ; « since » + point de départ (since 2022). Les deux se traduisent par « depuis »."},{"id":"ffr-010","theme":"false-friends","type":"fill","prompt":"She has been a partner ___ 2019.","hint":"depuis (un point de départ)","answers":["since"],"explanation":"« Since » + date ou événement de départ : since 2019, since Monday, since the merger."},{"id":"ffr-011","theme":"false-friends","type":"fill","prompt":"We need to ___ a decision before the end of the week.","hint":"prendre (une décision)","answers":["make","take","reach"],"explanation":"« To make a decision » : avec « make » on crée un résultat (a decision, a mistake, a profit, an effort).","note":"GB : « to take a decision » se dit aussi · US : to make a decision","term":"to make a decision","fr":"prendre une décision"},{"id":"ffr-012","theme":"false-friends","type":"fill","prompt":"Who is going to ___ the audit of the subsidiary?","hint":"faire, effectuer","answers":["do","perform","carry out","conduct"],"explanation":"« To do an audit » : avec « do » on accomplit une tâche (do an audit, do business, do the accounts). Plus soutenu : « to perform », « to carry out ».","term":"to carry out an audit","fr":"réaliser un audit"},{"id":"ffr-013","theme":"false-friends","type":"fill","prompt":"I did a six-month ___ at a Big Four firm.","hint":"stage","answers":["internship","placement","traineeship"],"explanation":"Un stage = « an internship
